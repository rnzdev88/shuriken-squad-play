.arm.hero{align-items:flex-start;text-align:left}

.hb button{flex:1;font-size:13px;padding:8px 6px;min-width:0}

.btns button .rgn{display:block;font-size:12px;font-weight:800;opacity:.8;margin-top:3px;letter-spacing:0}
.rgcard{margin:-4px 0 14px}

.rgcard .rgp{font-size:12px;color:#7dffa0;margin-top:8px;line-height:1.35}

.arm.rgrow{border-left:4px solid var(--rc)}

position:absolute;top:-8px;right:10px;background:#ff3b5c;color:#fff;font-size:10px;font-weight:900;letter-spacing:.08em;padding:3px 7px;border-radius:8px;box-shadow:0 2px 6px rgba(255,59,92,.5);animation:hnew 1.2s ease-in-out infinite}
@keyframes hnew{50%{transform:scale(1.12)}}

<body>
<canvas id="c"></canvas>
<div id="ui"></div>
<script>
(() => {
const cv = document.getElementById('c'), cx = cv.getContext('2d'), ui = document.getElementById('ui');
const W = 400; let H = 700, S = 1;
const RL = 40, RR = 360, MID = 200, SPEED = 130;
let SQY = 550;

function resize() {
  const iw = innerWidth, ih = innerHeight;
  H = Math.max(620, Math.min(900, W * ih / iw));
  S = Math.min(iw / W, ih / H);
  const d = window.devicePixelRatio || 1;
  cv.width = Math.round(W * S * d); cv.height = Math.round(H * S * d);
  cv.style.width = W * S + 'px'; cv.style.height = H * S + 'px';
  cv.style.marginTop = Math.max(0, (ih - H * S) / 2) + 'px';
  cx.setTransform(S * d, 0, 0, S * d, 0, 0);
  SQY = H - 150;
}
addEventListener('resize', resize); resize();

// Gameplay randomness goes through R, which newGame() seeds so a seed always rebuilds the same chapter.
// Purely visual randomness (particles, shake) uses frnd so it never shifts the gameplay sequence.
function makeRng(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
let R = Math.random;
const rnd = (a, b) => a + R() * (b - a);
const ri = (a, b) => Math.floor(rnd(a, b + 1));
const pick = a => a[Math.floor(R() * a.length)];
const frnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

// ---------- patch notes ----------
// Newest first. Bump GAME_VERSION and add an entry for every player-facing update;
// returning players see the notes once, new players only see the "What's New" button.
const GAME_VERSION = '1.9.3';
// Playtest build: every hero is owned from the start so testers can try them all.
// Set to false for release; heroes then unlock at their chapter (HEROES[id].unlock).
const TESTER_ALL_HEROES = true;
const PATCH_NOTES = [
  { v: '1.9.3', title: 'Fair Gates', date: 'Nov 2026', notes: [
    ['🎯', '<b>Fixed:</b> enemies standing in a gate couldn\'t be hit. Your shots now reach anything touching a gate; only enemies properly behind a gate are shielded.'],
    ['⚖️', 'Enemies have a bit more health to balance it out.'],
  ] },
  { v: '1.9.2', title: 'Your Squad', date: 'Nov 2026', notes: [
    ['🥷', '<b>Your squad gets art:</b> your ninjas are now illustrated, seen from behind as they charge, in the colours of your skin.'],
    ['👑', 'Kage, Tsubaki and Goro lead from the front with their own sprites, and Smoke Clones look like shadow ninjas.'],
  ] },
  { v: '1.9.1', title: 'New Look', date: 'Nov 2026', notes: [
    ['🎨', '<b>New character art:</b> heroes, all 6 bosses, the guardians and every enemy type now have illustrated sprites.'],
    ['🥷', 'Hero portraits on the home screen and in Heroes use the new art too.'],
  ] },
  { v: '1.9', title: 'Regions', date: 'Nov 2026', notes: [
    ['🗺️', '<b>Regions:</b> every 10 chapters is a new land with its own look, rule and boss: ❄️ <b>Snow Pass</b> (ch 11), 🏯 <b>Night Castle</b> (ch 21) and 🌊 <b>Storm Coast</b> (ch 31). Past chapter 40 they come back tougher.'],
    ['❄️', '<b>Snow Pass:</b> icy footing makes your squad slide, and ice sheets before gates mean you line up early. Boss <b>Yuki-onna</b> freezes your lane.'],
    ['🏯', '<b>Night Castle:</b> the road ahead is dark until your stars light it up. Boss <b>Ghost Shogun</b> vanishes and bursts out somewhere else.'],
    ['🌊', '<b>Storm Coast:</b> wind gusts (watch for 💨) blow your stars sideways. Boss <b>Raijin</b> calls down thunder lanes and tidal waves. Find the gap!'],
    ['🌬️', '<b>New weapon: Wind Fan.</b> Wind blades sweep across the lanes. Unlock it by taking 25 ⚡ SPEED or 💥 POWER gates. With the Mirror it evolves into <b>Fujin\'s Tempest</b>.'],
    ['🏹', '<b>New weapon: Yumi Longbow.</b> A heavy arrow at the toughest enemy, extra strong against guardians and bosses. Unlock it by defeating 16 guardians. With the Whetstone it evolves into <b>Heaven Piercer</b>.'],
    ['🚧', 'Gates now block everything you throw (kunai, talismans, clone stars and more), not just stars. To make up for it, several weapons hit harder.'],
    ['🧪', '<b>Playtest:</b> tap 🗺️ Regions at the bottom of the home screen to practise any region now. Practice runs don\'t change your progress.'],
  ] },
  { v: '1.8.1', title: 'Solid Gates', date: 'Nov 2026', notes: [
    ['🚧', '<b>Gates block stars:</b> stars that hit a gate stop there (and still raise its number). No more hitting enemies through a gate.'],
    ['👹', 'Gates never appear right in front of a guardian or boss anymore, so nothing can hide behind one.'],
    ['⚖️', 'To balance it out, kills give 25% more XP and bosses have a bit less health.'],
  ] },
  { v: '1.8', title: 'Heroes', date: 'Nov 2026', notes: [
    ['🥷', '<b>Heroes:</b> choose who leads your squad with the new hero button above Play. Each hero starts with a different weapon and has a signature skill.'],
    ['🦊', '<b>Tsubaki</b> (clear Chapter 4) starts with Fire Talisman and counts as an extra 🔥 Fire skill. Burning enemies take extra damage from everything.'],
    ['🐻', '<b>Goro</b> (clear Chapter 10) starts with Kusarigama and leads a bigger clan: more squad size, + gates recruit more, and he counts as an extra 🐝 Swarm skill. He throws a bit slower.'],
    ['✦', '<b>Hero Mastery:</b> spend coins to strengthen your hero\'s signature skill, up to level 5. Upgrades still power up every hero.'],
    ['🧪', '<b>Playtest:</b> all 3 heroes are unlocked for you right now so you can try them. In the full game they unlock as you progress.'],
  ] },
  { v: '1.7', title: 'Boons & Synergies', date: 'Nov 2026', notes: [
    ['🧬', '<b>Synergy sets:</b> every skill now has tags like 🔥 Fire, 🛡️ Steel or 🐝 Swarm. Own 3 skills with the same tag for a set bonus, and 4 for an even stronger ★ version. Skill cards show your progress.'],
    ['👑', '<b>Boons:</b> beating your 1st and 3rd guardian each chapter lets you pick a Boon, a powerful twist that lasts the whole run: Momentum, Last Stand, Gate Echo, Blood Pact and more.'],
    ['👥', '<b>New weapon: Smoke Clones.</b> Shadow clones fight beside your squad. Unlock them by running through ×2 or ×3 gates. Max them with the Abacus to evolve <b>Shadow Legion</b>, where every × gate multiplies your clones too.'],
    ['🎬', '<b>×2 Coins:</b> after any run, double the coins you earned from the results screen.'],
    ['💾', '<b>Save backup:</b> tap 💾 Save at the bottom of the home screen to copy a code with all your progress. On a new phone or browser, paste it into Restore to pick up where you left off.'],
    ['⚖️', 'Thousand Stars is a little weaker; Raijin\'s Drum, Phoenix Seal and Iron Cyclone hit harder. Enemies in later stages and bosses are tougher to match your new powers.'],
    ['🐛', 'Fixed: the coin counter could briefly show more coins than you had right after a run.'],
  ] },
  { v: '1.6', title: 'Second Wind & Daily Missions', date: 'Nov 2026', notes: [
    ['❤️', '<b>Revive:</b> once per run, when your squad falls you can get back up with 60% of your squad. A shockwave clears nearby enemies, guardians and bosses get knocked back, and you\'re untouchable for a moment.'],
    ['📋', '<b>Daily Missions:</b> 3 new goals every day (easy, medium, hard), like defeating enemies, dodging charges or shooting gates up. Each one pays coins, and finishing all 3 opens the <b>🎁 Daily Chest</b>.'],
    ['✅', 'The results screen tells you when a run completes a mission. Claim your rewards from Daily Missions on the home screen.'],
    ['🔊', 'Sound on/off moved to the bottom of the home screen.'],
  ] },
  { v: '1.5', title: 'The Armory', date: 'Nov 2026', notes: [
    ['🔓', '<b>Earn your arsenal:</b> you now start with a small kit (Shuriken Volley, Kunai Line, Headband, Whetstone, Iron Tabi). Every other weapon and skill is unlocked by completing a challenge, like dodging charges, shooting gates, or clearing a chapter after a sacrifice.'],
    ['⚔️', '<b>Armory</b> (home menu): see every skill, what unlocks the locked ones, your progress, and the evolutions you\'ve discovered.'],
    ['✨', 'Your next unlock and its progress show after every run. Skill cards also tell you when an evolution needs a skill you haven\'t unlocked yet.'],
    ['🪙', '<b>Economy rebalance:</b> upgrades were maxing out far too fast. Coin Bonus is now +5% per level, upgrades cost more as they level up, and the endless enemy stream gives XP but no coins. Your coins and upgrades are kept.'],
    ['⚖️', 'The first chapters are a little gentler while you build your arsenal.'],
    ['🐛', 'Fixed: setting a treasure chest on fire with a Fire Talisman could make its flames glitch.'],
  ] },
  { v: '1.4', title: 'Boss Battles', date: 'Nov 2026', notes: [
    ['👹', '<b>Real boss fights:</b> bosses no longer just walk at you. They hold their ground and attack, then lock onto your lane. A <b style="color:#ff6b6b">red strip</b> shows where they\'re about to charge, so sidestep!'],
    ['😡', '<b>Enraged:</b> at half health a boss gets angry, with faster attacks, more projectiles and quicker charges. The Iron Samurai\'s guards bring shields.'],
    ['⏱️', '<b>Don\'t stall:</b> after 40 seconds the boss goes <b>Berserk</b> and advances. Finish it before it reaches you!'],
    ['⚖️', 'Bosses are much tougher, so a good build really matters now. The first few chapters\' bosses are gentler while you learn.'],
  ] },
  { v: '1.3', title: 'Endless Waves', date: 'Nov 2026', notes: [

// Chapter c, stage s plays at tier lv = (c-1)*STAGES + s, so the original 500-level curve spans 100 chapters.
const tierOf = (c, s) => (c - 1) * STAGES + s;
// G: "scale" of the game in ninjas. Gate values, enemy HP and damage all grow with it.
const Gs = lv => 1 + 0.15 * (lv - 1);
// D: 0..1 difficulty ramp (density, speed, aggression) that maxes out at tier 300
const Dr = lv => Math.min(1, (lv - 1) / 300);

// so a player who keeps up feels ahead of the curve. It depends only on the tier, never on what the player owns,

const upExp = lv => Math.min(50, (lv - 1) / 7);

function gateSide(lv, good) {
  const G = Gs(lv), D = Dr(lv);
  if (good) {
    const t = pick(['add', 'add', 'add', 'add', 'mul', 'rate', 'dmg']);
    if (t === 'add') return { t, v: Math.round(ri(3, 8) * G), acc: 0 };
    if (t === 'mul') return { t, v: R() < .2 ? 3 : 2 };
    return { t };
  }
  if (R() < 0.75) return { t: 'add', v: -Math.round(ri(3, 8) * G * (1 + D)), acc: 0 };
  return { t: 'div', v: R() < D * .5 ? 3 : 2 };
}

// Choice Gate: every lane is good, in a different situation. There is always a skill lane and a squad lane;
// the rest are drawn from the remaining types.
//  add (big +N) / rally (refill to cap): when the squad is low
//  skill: a draft pick now, for 30% of the squad (best when the squad is near full)
//  sac: halve the squad for ×1.5 damage (Elite / Ronin builds)
//  gold: coins for upgrades (greed)
function choiceGate(lv, lanes) {
  const G = Gs(lv);
  const make = t => t === 'add' ? { t, v: Math.round(ri(9, 15) * G), acc: 0, ch: 1 }
    : t === 'gold' ? { t, v: ri(15, 25), ch: 1 } : { t, ch: 1 };
  const types = ['skill', pick(['add', 'rally'])];
  const rest = ['add', 'rally', 'sac', 'gold'].filter(t => !types.includes(t));
  while (types.length < lanes) types.push(rest.length ? rest.splice(Math.floor(R() * rest.length), 1)[0] : 'skill');
  for (let i = types.length - 1; i > 0; i--) { const j = Math.floor(R() * (i + 1)); [types[i], types[j]] = [types[j], types[i]]; }
  return types.map(make);

  return end + 560;

    const n = Math.min(g.count, evo ? 18 : 10), dmg = power() * (1 + volleyBonus(skl('volley'))) * (1 + heroSig('kage')) * (evo ? 1.3 : 1) / n * (g.spread > 0 ? 1.2 : 1) * (fire ? 1.8 : 1);

    } else if (o.k === 'en' && y > -40) {

      if (y > H * 0.25 && !o.archer) o.x += Math.sign(g.sx - o.x) * Math.min(Math.abs(g.sx - o.x), 22 * dt);
    }
    if (o.k === 'boss' && g.bossMode) updateBoss(o, y, dt);
    if (o.k === 'mini' && y > -40) {
      if (!o.seen && y > 60) { o.seen = true; g.banner = { txt: 'GUARDIAN: ' + MINIS[o.t].name, sub: '⚠ ONE TOUCH = DEFEAT' + (boonNext() ? ' · 👑 BOON REWARD' : ''), t: 1.8, red: true, small: true }; SFX.boss(); }

      else if (y < SQY - GUARD_Y_OFF) o.d -= 22 * (1 + .4 * g.D) * dt;

        o.hold = (o.hold ?? GUARD_HOLD) - dt;

        if (o.hold <= 0) o.charging = true;
      }
      if (!o.charging) {
        if (o.t === 0) o.x += clamp(g.sx - o.x, -1, 1) * 75 * (1 + .5 * g.D) * dt;
        else o.x = clamp(o.x + Math.sin(o.ph * .4) * 40 * dt, RL + 30, RR - 30);
        if (o.t === 1 && o.atkT <= 0 && y > 80) { o.atkT = 1.7 * (1 - .4 * g.D); enemyShot(o.x, y + 20, 'bomb', 190 * (1 + .3 * g.D)); SFX.arrow(); }
        if (o.t === 2 && o.atkT <= 0 && y > 80) { o.atkT = 2.4 * (1 - .4 * g.D); enemyShot(o.x, y + 10, 'arrow', 280); }

  const ignite = g.sets.Fire ? power() * (g.sets.Fire > 1 ? .25 : .15) : 0; // Fire set: burn damage per second
  for (const b of g.bullets) {
    const y0 = b.y;
    if (g.windA) b.vx += g.windA * dt; // Storm Coast gust

    if (b.y < -20 || b.x < RL - 10 || b.x > RR + 10) { b.dead = true; continue; }
    // Gates absorb stars (raising a + gate's number), so nothing behind a gate can be hit through it (see gateAbsorb).

    for (const o of vis) {
      if (o.dead) continue;
      const oy = sy(o);
      if (o.k === 'gate' || o.k === 'spike' || o.k === 'stage' || o.k === 'torii' || o.k === 'ice' || o.hidden || o === b.last || (o.k === 'mini' && oy < 60)) continue;
      const rr = o.k === 'crate' ? 20 : o.r;
      if (Math.abs(b.x - o.x) < rr && Math.abs(b.y - oy) < rr) {

        if (ignite && !o.burn && o.k !== 'crate') o.burn = { t: 2, dps: ignite };

    if (e.y > H + 20 || e.x < -20 || e.x > W + 20) { e.dead = true; continue; }
    const hitR = (e.kind === 'rock' || e.kind === 'bomb') ? 14 : e.kind === 'orb' ? 12 : e.kind === 'wisp' ? 10 : 6;
    if (Math.abs(e.x - g.sx) < r * .8 + hitR && Math.abs(e.y - SQY) < r * .5 + hitR) {

    if (o.k === 'gate' && !o.used && y >= SQY) { o.used = true; applyGate(o.opts[laneOf(g.sx, o.opts.length)]); }
    else if (o.k === 'mini' && g.invuln <= 0 && Math.abs(y - SQY) < r * .7 + o.r && Math.abs(o.x - g.sx) < r + o.r) {

    else if (o.k === 'en' && Math.abs(y - SQY) < r * 0.7 + o.r && Math.abs(o.x - g.sx) < r + o.r) {
      o.dead = true; hurtSquad(loss(o.big ? 6 : o.smax ? 2 : 1, g.lv), o.x, y);
    } else if (o.k === 'spike' && !o.hit && Math.abs(y - SQY) < 14 && g.sx + r * .6 > o.x0 && g.sx - r * .6 < o.x1) {

    }
    if (y > H + 80) { if (o.k === 'mini' && !o.dead) { pop(g.sx, SQY - 60, 'GUARDIAN ESCAPED', '#cfd6e0', true); if (o.charging) g.st.dodges++; } o.dead = true; }
  }
  g.objs = g.objs.filter(o => !o.dead);
  g.count = Math.max(0, Math.floor(g.count));
  if (g.count <= 0) { if (!g.revived) offerRevive(); else lose(); return; }

  for (const p of g.parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 300 * dt; p.t -= dt; }
  g.parts = g.parts.filter(p => p.t > 0);

  g.pops = g.pops.filter(p => p.t > 0);

// ---------- boss fight ----------
// The boss holds near the top and fights in phases instead of walking into the squad:

//   Touching the boss is defeat, so every charge is telegraphed and can be sidestepped.

        if (rage) { e.shield = e.smax = 18 * H2; e.hp = e.max = 8 * H2; e.r = 12; }

  if (o.specT <= 0 && g.hz.length && (g.hz.some(h => h.warn > 0 || h.k === 'wave') || frozenLanes() >= g.lanes - 1)) o.specT = .5;

// ---------- region bosses ----------
// Built on the same phases (idle → telegraph → charge → return, enrage, berserk); each adds a telegraphed signature
// attack that costs ninjas, never the run: only touching the boss is instant defeat.
const GHOST_FADE = .45, GHOST_GONE = .95;

    const tx = MID + Math.sin(o.ph * .22) * 95; o.x += (tx - o.x) * Math.min(1, dt * 2);
    if (o.atkT <= 0) { o.atkT = 2 * spd; for (const a of rage ? [-.22, 0, .22] : [-.11, .11]) enemyShot(o.x, y + 24, 'ice', 230 * (1 + .3 * D), a); SFX.arrow(); }
    if (o.spT <= 0 && o.specT > 1) { o.spT = (rage ? 4.4 : 5.8) * (1 - .2 * D); laneHazards('frost', rage ? 2 : 1, FROST_WARN * (rage ? .85 : 1)); }
  } else if (o.bt === 4) { // Ghost Shogun: stalks the squad, will-o-wisps, vanishes and bursts out somewhere else
    o.x += clamp(g.sx - o.x, -1, 1) * Math.min(Math.abs(g.sx - o.x), 26 * dt);
    if (o.atkT <= 0) { o.atkT = 2.3 * spd; for (const a of rage ? [-.22, 0, .22] : [-.13, .13]) enemyShot(o.x, y + 26, 'wisp', 165 * (1 + .3 * D), a); SFX.arrow(); }
    if (o.spT <= 0 && o.specT > 1.4) {
      o.spT = (rage ? 4.6 : 6) * (1 - .2 * D); o.state = 'vanish'; o.stT = GHOST_FADE + GHOST_GONE;
      o.nx = clamp(g.sx + rnd(-110, 110), RL + o.r, RR - o.r); SFX.smoke(); return true;
    }
  } else { // Raijin: sways, thunder orbs, then alternates thunder lanes and a tidal wave with one safe gap

      if ((o.spN = (o.spN || 0) + 1) % 2) laneHazards('bolt', rage ? 2 : 1, BOLT_WARN * (rage ? .85 : 1));

}
const laneX = i => RL + i * (RR - RL) / g.lanes;

function laneHazards(k, n, warn) {

  for (const i of pickd) g.hz.push({ k, x0: laneX(i), x1: laneX(i + 1), warn, live: k === 'frost' ? FROST_LIVE : .35, tick: .35 });

        else if (h.k === 'bolt') { SFX.zap(); SFX.boom(); g.shake = .3; if (inHz(h)) hurtSquad(loss(4, g.lv), g.sx, SQY, true); }
        else SFX.smoke();

      if (inHz(h)) { h.tick -= dt; if (h.tick <= 0) { h.tick = .7; hurtSquad(loss(1, g.lv), g.sx, SQY, true); } } else h.tick = .35;

// ---------- region twists ----------
// Snow Pass: the squad chases the steering target on a spring, so it slides a little, and a lot on an ice patch
const ICE_K = [110, 15], ICE_PATCH_K = [30, 3.6];

const WIND_WARN = 1.6, WIND_BLOW = 3.2, WIND_ACC = 300;

// ---------- sprite art ----------
// Character art lives in art/<id>.webp (generated with ComfyUI). Each sprite loads in the background; until it has
// loaded (or if it's missing), the shapes drawn in code below are used instead, so the game never depends on it.
const ART_IDS = ['hero_kage', 'hero_tsubaki', 'hero_goro', 'boss_oni', 'boss_tengu', 'boss_samurai', 'boss_yuki', 'boss_ghost',
  'boss_raijin', 'mini_blade', 'mini_monk', 'mini_twins', 'enemy_grunt', 'enemy_brute', 'enemy_archer', 'enemy_shield',
  // the player's side, seen from behind: one squad ninja per skin, and each hero leading
  'squad_azure', 'squad_jade', 'squad_sakura', 'squad_gold', 'squad_shadow', 'squad_ghost', 'lead_kage', 'lead_tsubaki', 'lead_goro'];
const BOSS_ART = ['boss_oni', 'boss_tengu', 'boss_samurai', 'boss_yuki', 'boss_ghost', 'boss_raijin'];
const MINI_ART = ['mini_blade', 'mini_monk', 'mini_twins'];
const ART = {}; // id → { img, white, red } once loaded
// a solid-colour silhouette of a sprite, for the hit flash and the guardian charge warning
function artTint(img, col) {
  const c = document.createElement('canvas'); c.width = img.width; c.height = img.height;
  const x = c.getContext('2d'); x.drawImage(img, 0, 0); x.globalCompositeOperation = 'source-in'; x.fillStyle = col; x.fillRect(0, 0, c.width, c.height);
  return c;
}
function loadArt() {
  if (typeof Image === 'undefined') return; // headless tools: keep the drawn shapes
  for (const id of ART_IDS) {
    const img = new Image();
    img.onload = () => { try { ART[id] = { img, white: artTint(img, '#ffffff'), red: artTint(img, '#ff3b3b') }; } catch (e) {} };
    img.src = 'art/' + id + '.webp';
  }
}
// Draw sprite `id` standing with its feet at (x, feet), `h` px tall (flash: see below). Returns false if it isn't loaded (caller draws shapes).
function drawArt(id, x, feet, h, flash, warn, alpha = 1) {

  const now = performance.now(), sk = curSkin(), squadArt = ART['squad_' + sk.id] ? 'squad_' + sk.id : null;
  for (const [x, y, i] of pts) {

    cx.fillStyle = sk.body; cx.beginPath(); cx.arc(x, yy, 6.5, 0, 7); cx.fill();
    cx.fillStyle = 'rgba(255,255,255,.08)'; cx.beginPath(); cx.arc(x, yy - .5, 5, 0, 7); cx.fill();
    cx.fillStyle = sk.col; cx.fillRect(x - 5, yy - 4.5, 10, 2);
    cx.fillStyle = '#f1c27d'; cx.fillRect(x - 3.5, yy - 2, 7, 2.5);

  }
  if (g.count > 0) drawLeader(g.sx, SQY + r * .3 + Math.sin(now / 120) * 1.2, hero, sk, now);
  const t = String(g.count);
  cx.font = '900 18px system-ui,sans-serif'; cx.textAlign = 'center';
  const w = cx.measureText(t).width + 20, by = SQY - r * .6 - 30;
  cx.fillStyle = g.count >= g.cap ? '#d99a00' : '#1e88ff'; rrect(g.sx - w / 2, by - 15, w, 26, 13); cx.fill();
  cx.fillStyle = '#fff'; cx.fillText(t, g.sx, by + 5);
}

// the hero, drawn in front of the squad: bigger, in their own garb, wearing the squad skin's headband
function drawLeader(x, y, h, sk, now) {
  // sprite art when loaded: the hero seen from behind, leading the charge
  const heroId = Object.keys(HEROES).find(k => HEROES[k] === h);
  if (drawArt('lead_' + heroId, x, y + 12, h === HEROES.goro ? 50 : 42)) return;
  const big = h === HEROES.goro ? 11 : 9, tail = Math.sin(now / 60) * 3;
  cx.strokeStyle = h === HEROES.kage ? h.col : sk.col; cx.lineWidth = 3; // Kage's long blue scarf, the others wear the skin colour
  cx.beginPath(); cx.moveTo(x + 4, y + 1); cx.lineTo(x + 13, y + 8 + tail); cx.moveTo(x + 4, y + 1); cx.lineTo(x + 8, y + 12 - tail); cx.stroke();
  cx.fillStyle = h.col; cx.beginPath(); cx.arc(x, y, big + 2, 0, 7); cx.fill(); // coloured outline
  cx.fillStyle = h.body; cx.beginPath(); cx.arc(x, y, big, 0, 7); cx.fill();
  cx.fillStyle = sk.col; cx.fillRect(x - big + 2, y - big * .65, big * 2 - 4, 3);
  cx.fillStyle = '#f1c27d'; cx.fillRect(x - big * .55, y - big * .25, big * 1.1, 3.5);
  if (h === HEROES.kage) drawStar(x, y - big - 3, 3.5, now / 200, false, true);
  else if (h === HEROES.tsubaki) { // a blossom in her hair
    cx.fillStyle = h.trim; for (let i = 0; i < 5; i++) { const a = i * 1.257; cx.beginPath(); cx.arc(x + 6 + Math.cos(a) * 3, y - big + Math.sin(a) * 3, 2.2, 0, 7); cx.fill(); }
    cx.fillStyle = '#ffd84d'; cx.beginPath(); cx.arc(x + 6, y - big, 1.6, 0, 7); cx.fill();
  } else { // Goro's gold kabuto horns
    cx.fillStyle = h.col;
    cx.beginPath(); cx.moveTo(x - 7, y - big + 2); cx.lineTo(x - 11, y - big - 9); cx.lineTo(x - 3, y - big + 1); cx.fill();
    cx.beginPath(); cx.moveTo(x + 7, y - big + 2); cx.lineTo(x + 11, y - big - 9); cx.lineTo(x + 3, y - big + 1); cx.fill();
  }
}

// ---------- heroes screen ----------
// Hero bust painted once per hero + skin on an offscreen canvas (the same look as the in-game leader, at portrait
// size). Falls back to the emoji when canvas export isn't available.
const heroArtCache = {};
function heroArt(id) {
  const h = HEROES[id], sk = curSkin(), key = id + '|' + sk.id;
  if (key in heroArtCache) return heroArtCache[key];
  let url = '';
  try {
    const S = 128, c = document.createElement('canvas'); c.width = c.height = S;
    const x = c.getContext('2d'), cx0 = 64, cy = 72, R = id === 'goro' ? 42 : 38;
    const gl = x.createRadialGradient(cx0, cy, 8, cx0, cy, 64); gl.addColorStop(0, h.col + 'aa'); gl.addColorStop(1, h.col + '00');
    x.fillStyle = gl; x.fillRect(0, 0, S, S);
    // scarf tails behind the head: Kage's long scarf is his colour, the others wear the skin's
    x.strokeStyle = id === 'kage' ? h.col : sk.col; x.lineWidth = 7; x.lineCap = 'round';
    x.beginPath(); x.moveTo(cx0 + R * .7, cy - R * .45); x.quadraticCurveTo(cx0 + R + 14, cy - 10, cx0 + R + 20, cy + 14);
    x.moveTo(cx0 + R * .7, cy - R * .45); x.quadraticCurveTo(cx0 + R + 4, cy + 4, cx0 + R + 4, cy + 26); x.stroke();
    x.fillStyle = h.col; x.beginPath(); x.arc(cx0, cy, R + 4, 0, 7); x.fill();
    x.fillStyle = h.body; x.beginPath(); x.arc(cx0, cy, R, 0, 7); x.fill();
    x.fillStyle = 'rgba(255,255,255,.09)'; x.beginPath(); x.arc(cx0 - 6, cy - 8, R * .72, 0, 7); x.fill();
    // headband with its knot, in the squad skin colour
    x.fillStyle = sk.col; x.fillRect(cx0 - R + 4, cy - R * .62, R * 2 - 8, 9);
    x.beginPath(); x.arc(cx0 + R * .72, cy - R * .62 + 4.5, 6, 0, 7); x.fill();
    // face opening with eyes and a determined brow
    const fw = R * 1.3, fy = cy - 6;
    x.fillStyle = '#f1c27d'; x.beginPath(); x.roundRect ? x.roundRect(cx0 - fw / 2, fy, fw, 17, 8) : x.rect(cx0 - fw / 2, fy, fw, 17); x.fill();
    for (const s of [-1, 1]) {
      const ex = cx0 + s * R * .3;
      x.fillStyle = '#1a1200'; x.beginPath(); x.ellipse(ex, fy + 9.5, 4, 4.6, 0, 0, 7); x.fill();
      x.fillStyle = '#fff'; x.beginPath(); x.arc(ex + 1.3, fy + 8, 1.4, 0, 7); x.fill();
      x.strokeStyle = h.body; x.lineWidth = 3; x.beginPath(); x.moveTo(ex - s * 6, fy + 1.5); x.lineTo(ex + s * 5, fy + 4.5); x.stroke();
    }
    if (id === 'kage') { // a gold shuriken above the head
      x.fillStyle = h.trim; x.beginPath();
      for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4 + .3, r = i % 2 ? 4 : 13; x.lineTo(cx0 + Math.cos(a) * r, cy - R - 12 + Math.sin(a) * r); }
      x.fill(); x.fillStyle = h.body; x.beginPath(); x.arc(cx0, cy - R - 12, 2.5, 0, 7); x.fill();
    } else if (id === 'tsubaki') { // a blossom in her hair
      const bx = cx0 + R * .55, by = cy - R * .8;
      x.fillStyle = h.trim; for (let i = 0; i < 5; i++) { const a = i * 1.257; x.beginPath(); x.arc(bx + Math.cos(a) * 7, by + Math.sin(a) * 7, 5.5, 0, 7); x.fill(); }
      x.fillStyle = '#ffd84d'; x.beginPath(); x.arc(bx, by, 4, 0, 7); x.fill();
    } else { // Goro's gold kabuto horns
      x.fillStyle = h.col;
      for (const s of [-1, 1]) { x.beginPath(); x.moveTo(cx0 + s * 14, cy - R + 6); x.quadraticCurveTo(cx0 + s * 30, cy - R - 6, cx0 + s * 36, cy - R - 24); x.lineTo(cx0 + s * 6, cy - R + 4); x.fill(); }
    }
    url = c.toDataURL();
  } catch (e) { url = ''; }
  return heroArtCache[key] = typeof url === 'string' && url.startsWith('data:image') ? url : '';
}

function heroScreen() {
  save.heroNew = false; persist();
  const dots = m => `<div class="dots">${Array.from({ length: MASTERY_MAX }, (_, i) => `<i class="${i < m ? 'on' : ''}"></i>`).join('')}</div>`;
  const rows = Object.keys(HEROES).map(id => {
    const h = HEROES[id], own = id in save.heroes, m = save.heroes[id] || 1, sel = save.hero === id, w = SK[h.weapon];
    const start = `<div class="d">Starts with ${w.icon} <b>${w.name}</b>${h.weapon === 'volley' ? '' : ' instead of ✴️ Volley'}</div>`;
    const sig = `<div class="d">✦ <b style="color:${h.col}">${h.sig}:</b> ${h.sd(m)}${h.con ? `. <span style="color:#ff9c9c">${h.con}</span>` : ''}</div>`;
    if (!own) {
      const goal = h.unlock - 1, cur = Math.min(goal, save.chapter - 1);
      return `<div class="arm hero locked">${heroPortrait(h)}<div class="info"><div class="n">${h.name}<span class="pill lock">🔒 LOCKED</span></div><div class="tg">${h.role.toUpperCase()}</div>${start}${sig}
        <div class="d">🎯 Clear Chapter ${goal} to unlock</div><div class="pbar"><i style="width:${cur / goal * 100}%"></i></div><div class="d">${cur} / ${goal} chapters</div></div></div>`;
    }
    const cost = masteryCost(m), maxed = m >= MASTERY_MAX;
    const mbtn = maxed ? '<span class="mx">✦ MASTERY MAX</span>'
      : `<button data-mh="${id}" class="${sel ? '' : 'sec'}" ${save.coins < cost ? 'disabled' : ''}>⬆ Mastery 🪙${fmtN(cost)}</button>`;
    return `<div class="arm hero${sel ? ' sel' : ''}">${heroPortrait(h)}<div class="info"><div class="n">${h.name}${sel ? '<span class="pill own">LEADING</span>' : ''}</div><div class="tg">${h.role.toUpperCase()}</div>${start}${sig}
      ${dots(m)}${maxed ? '' : `<div class="d">Next: ${h.sd(m + 1).split('. ')[0]}</div>`}<div class="hb">${sel ? '' : `<button data-hs="${id}" class="lead">Lead</button>`}${mbtn}</div></div></div>`;
  }).join('');
  panel(`<h2>🥷 Heroes</h2>${coinTag()}<div class="notes">${rows}</div><div class="help" style="margin:0 0 10px">Your hero leads the squad and picks its first weapon. Upgrades power up every hero.</div>`,
    [['Back', home, 'sec']]);
  ui.querySelectorAll('button[data-hs]').forEach(b => b.onclick = () => { initAudio(); SFX.good(); save.hero = b.dataset.hs; persist(); heroScreen(); });
  ui.querySelectorAll('button[data-mh]').forEach(b => b.onclick = () => {
    const id = b.dataset.mh, m = save.heroes[id], c = masteryCost(m);
    if (!(id in save.heroes) || m >= MASTERY_MAX || save.coins < c) return;
    save.coins -= c; save.heroes[id] = m + 1; persist(); initAudio(); SFX.power(); heroScreen();
  });
}

// ---------- save backup / restore codes ----------
// Testers lose progress when they switch device or browser, or clear site data. A save code carries the whole
// save: SS1.<base64url of the UTF-8 JSON>.<checksum>. The checksum (FNV-1a, base36) rejects truncated or
// mistyped codes, the JSON is then sanity-checked, and a restored save goes through migrateSave() exactly
// like one loaded from localStorage. (It stops accidents, not cheaters: the save is client-side anyway.)
const CODE_VER = 'SS1';
const codeSum = body => hashStr(CODE_VER + '.' + body).toString(36);
function b64url(bytes) {
  let bin = '';
  for (const b of bytes) bin += String.fromCharCode(b);
  return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
const unb64url = s => Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/') + '==='.slice((s.length + 3) % 4)), ch => ch.charCodeAt(0));
function saveCode() {
  const body = b64url(new TextEncoder().encode(JSON.stringify(save)));
  return `${CODE_VER}.${body}.${codeSum(body)}`;
}
const isObj = v => !!v && typeof v === 'object' && !Array.isArray(v);
const isNum = (v, lo, hi) => typeof v === 'number' && isFinite(v) && v >= lo && v <= hi;
function validSave(s) {
  if (!isObj(s) || !Number.isInteger(s.chapter) || !isNum(s.chapter, 1, 1e6) || !isNum(s.coins, 0, 1e15)) return false;
  if ('up' in s && (!isObj(s.up) || Object.keys(s.up).some(k => !Number.isInteger(s.up[k]) || !isNum(s.up[k], 0, MAXUP)))) return false;
  if ('stats' in s && (!isObj(s.stats) || Object.keys(s.stats).some(k => !isNum(s.stats[k], 0, 1e15)))) return false;
  for (const k of ['skins', 'unlocked', 'evoSeen', 'regionSeen']) if (k in s && (!Array.isArray(s[k]) || s[k].some(v => typeof v !== 'string'))) return false;
  if ('daily' in s && !isObj(s.daily)) return false;
  if ('heroes' in s && (!isObj(s.heroes) || Object.values(s.heroes).some(m => !Number.isInteger(m) || !isNum(m, 1, MASTERY_MAX)))) return false;
  if ('hero' in s && typeof s.hero !== 'string') return false;
  if ('missions' in s && s.missions !== null && !(isObj(s.missions) && Array.isArray(s.missions.list))) return false;
  return true;
}
// → { save } for a good code, { error } with a player-facing reason otherwise
function readSaveCode(code) {
  const txt = String(code || '').replace(/\s+/g, '');
  if (!txt) return { error: 'Paste a save code first.' };
  const m = /^SS(\d+)\.([A-Za-z0-9_-]+)\.([0-9a-z]{1,7})$/.exec(txt);
  if (!m) return { error: "That isn't a Shuriken Squad save code. Codes start with SS1." };
  if ('SS' + m[1] !== CODE_VER) return { error: 'This code comes from a newer version of the game. Reload the page to update, then try again.' };
  if (codeSum(m[2]) !== m[3]) return { error: "This code is incomplete or has a typo. Copy the whole code again and paste it here." };
  let s = null;
  try { s = JSON.parse(new TextDecoder('utf-8', { fatal: true }).decode(unb64url(m[2]))); } catch (e) {}
  if (!validSave(s)) return { error: "This code is damaged and can't be loaded." };
  return { save: s };
}
const escHtml = s => String(s).replace(/[&<>"']/g, ch => '&#' + ch.charCodeAt(0) + ';');
function backup(err = '', pasted = '') {
  const code = saveCode();
  panel(`<h2>💾 Save Backup</h2><div class="bk">
    <div class="sect">Back up</div>
    <div class="help">Keep this code somewhere safe (notes, email, a message to yourself). It holds all your progress.</div>
    <textarea id="bkcode" class="code" rows="3" readonly spellcheck="false">${code}</textarea>
    <button id="bkcopy">📋 Copy code</button><div id="bkmsg" class="bkmsg"></div>
    <div class="sect">Restore</div>
    <div class="help">New phone or browser? Paste your code here to load that progress.</div>
    <textarea id="rscode" class="code" rows="3" placeholder="SS1.…" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">${escHtml(pasted)}</textarea>
    ${err ? `<div class="bkmsg bad">${err}</div>` : ''}<button id="rsgo" class="sec">Restore</button></div>`,
    [['Back', home, 'sec']]);
  document.getElementById('bkcopy').onclick = () => {
    initAudio(); SFX.click();
    const ta = document.getElementById('bkcode'), msg = document.getElementById('bkmsg');
    const done = () => { msg.textContent = '✓ Copied! Paste it somewhere safe.'; SFX.good(); };
    const manual = () => { // no clipboard access: select it so the player can copy it themselves
      let ok = false;
      try { ta.focus(); ta.select(); ta.setSelectionRange(0, code.length); ok = document.execCommand('copy'); } catch (e) {}
      if (ok) done(); else msg.textContent = "Couldn't copy automatically. The code is selected: copy it with your device's Copy option.";
    };
    try { navigator.clipboard.writeText(code).then(done, manual); } catch (e) { manual(); }
  };
  document.getElementById('rsgo').onclick = () => {
    initAudio(); SFX.click();
    const txt = document.getElementById('rscode').value || '', r = readSaveCode(txt);
    if (r.error) { SFX.bad(); backup(r.error, txt); } else confirmRestore(r.save);
  };
}
function confirmRestore(s) {
  const row = (lbl, x) => `<div class="up"><div class="info"><div class="n">${lbl}</div><div class="d">Chapter <b>${x.chapter}</b> · 🪙 <b>${fmtN(Math.floor(x.coins))}</b> · upgrades Lv <b>${Object.values(x.up).reduce((a, b) => a + b, 0)}</b> · ${x.unlocked.length} skills</div></div></div>`;
  panel(`<h2>💾 Load this save?</h2>${row('📥 From the code', migrateSave(s))}${row('📱 On this device now', save)}
    <div class="help">Your current progress on this device will be <b>replaced</b>. Back it up first if you might want it again.</div>`,
    [['✓ Load save', () => { loadSave(s); persist(); SFX.daily(); home(); }], ['Cancel', () => backup(), 'sec']]);
}

// results / pause build chips; bn === null leaves out set bonuses and boons (the pause screen lists them itself)

// ---------- armory: every skill, locked ones with their challenge and progress ----------
const fmtN = n => n.toLocaleString('en-US');
function unlockProgress(id) {
  const u = UNLOCKS[id], cur = Math.min(u.goal, save.stats[u.stat] || 0);
  return { cur, goal: u.goal, p: cur / u.goal };
}
function armory() {
  save.armoryNew = false; persist();
  // Owned and locked skills must be impossible to mix up: owned first with a STARTER / ✓ UNLOCKED pill,
  // locked below with a dashed outline, a 🔒 LOCKED pill and the challenge spelled out.
  const row = id => {
    const s = SK[id];
    if (isUnlocked(id)) {
      const pill = STARTER.includes(id) ? '<span class="pill own">STARTER</span>' : '<span class="pill own">✓ UNLOCKED</span>';
      return `<div class="arm"><span class="ai">${s.icon}</span><div class="info"><div class="n">${s.name}${pill}</div><div class="tg">${s.tags.map(t => TAGS[t].icon + ' ' + t.toUpperCase()).join(' · ')}</div><div class="d">${s.d(1)}</div></div></div>`;
    }
    const { cur, goal, p } = unlockProgress(id);
    const bar = goal > 1 ? `<div class="pbar"><i style="width:${p * 100}%"></i></div><div class="d">${fmtN(cur)} / ${fmtN(goal)}</div>` : '';
    return `<div class="arm locked"><span class="ai">${s.icon}</span><div class="info"><div class="n">${s.name}<span class="pill lock">🔒 LOCKED</span></div><div class="d">🎯 Challenge: ${UNLOCKS[id].cond}</div>${bar}</div></div>`;
  };
  const list = filter => { const sel = Object.keys(SK).filter(filter); return [...sel.filter(isUnlocked), ...sel.filter(id => !isUnlocked(id))].map(row).join(''); };
  const evoRow = a => {
    const e = EVOS[a], w = SK[a], p = SK[e.with];
    return save.evoSeen.includes(a)
      ? `<div class="arm"><span class="ai">${e.icon}</span><div class="info"><div class="n" style="color:#ffd84d">${e.name}</div><div class="d">${w.icon} ${w.name} + ${p.icon} ${p.name}</div></div></div>`
      : `<div class="arm locked"><span class="ai">❓</span><div class="info"><div class="n">???</div><div class="d">Evolves from ${w.icon} ${w.name}</div></div></div>`;
  };
  const setRow = t => `<div class="arm"><span class="ai">${TAGS[t].icon}</span><div class="info"><div class="n" style="color:${TAGS[t].col}">${t}</div><div class="d">${TAGS[t].d[0]}<br>★ ${TAGS[t].d[1]}</div><div class="d">${Object.keys(SK).filter(id => SK[id].tags.includes(t)).map(id => SK[id].icon).join(' ')}</div></div></div>`;
  const ids = Object.keys(SK), got = ids.filter(isUnlocked).length;
  panel(`<h2>⚔️ Armory</h2><p style="margin:0 0 10px">${got} / ${ids.length} skills · ${save.evoSeen.length} / ${Object.keys(EVOS).length} evolutions</p>
    <div class="notes"><div class="sect">Weapons</div>${list(id => SK[id].a)}
    <div class="sect">Passive skills</div>${list(id => !SK[id].a)}
    <div class="sect">Evolutions</div>${Object.keys(EVOS).map(evoRow).join('')}
    <div class="sect">Synergy sets</div><div class="help" style="text-align:left;margin:0 0 7px">Own ${SET_AT[0]} skills with the same tag for a set bonus, ${SET_AT[1]} for the ★ version.</div>${Object.keys(TAGS).map(setRow).join('')}</div>`, [['Back', home, 'sec']]);
}

// ---------- daily missions ----------
// Three a day (easy / medium / hard), the same all day and seeded by the date. Progress comes from finished runs.
// Rewards scale with the player's chapter; claiming all three opens the Daily Chest.
const MISSIONS = [
  { stat: 'kills',     goals: [600, 1200, 2000], txt: n => `Defeat ${fmtN(n)} enemies` },
  { stat: 'stages',    goals: [4, 8, 12],        txt: n => `Clear ${n} stages` },
  { stat: 'dodges',    goals: [2, 4, 6],         txt: n => `Dodge ${n} guardian or boss charges` },
  { stat: 'choices',   goals: [3, 5, 8],         txt: n => `Take ${n} Choice Gate lanes` },
  { stat: 'gateBumps', goals: [8, 15, 25],       txt: n => `Raise gates ${n} times by shooting them` },
  { stat: 'guardians', goals: [3, 6, 10],        txt: n => `Defeat ${n} guardians` },
  { stat: 'levelups',  goals: [10, 20, 30],      txt: n => `Level up ${n} times` },
  { stat: 'evolves',   goals: [1, 2, 3],         txt: n => `Evolve ${n} weapon${n > 1 ? 's' : ''}` },
];
const MISSION_PAY = [100, 150, 220], CHEST_PAY = 300;
const missionG = () => Gs(tierOf(save.chapter, 3)); // rewards grow with the chapter like everything else
const missionReward = m => Math.round(MISSION_PAY[m.tier] * missionG());
const chestReward = () => Math.round(CHEST_PAY * missionG());
function hashStr(s) { let h = 2166136261; for (const ch of s) h = Math.imul(h ^ ch.charCodeAt(0), 16777619); return h >>> 0; }
function ensureMissions() {
  const day = dayKey(Date.now());
  if (save.missions && save.missions.day === day) return save.missions;
  // evolving needs a complete pair unlocked; don't hand brand-new players an impossible mission
  const canEvolve = Object.keys(EVOS).some(a => isUnlocked(a) && isUnlocked(EVOS[a].with));
  const pool = MISSIONS.filter(m => m.stat !== 'evolves' || canEvolve), rng = makeRng(hashStr(day)), picks = [];
  while (picks.length < 3) picks.push(pool.splice(Math.floor(rng() * pool.length), 1)[0]);
  save.missions = { day, list: picks.map((m, i) => ({ stat: m.stat, goal: m.goals[i], prog: 0, claimed: false, tier: i })), chest: false };
  persist();
  return save.missions;
}
function missionsClaimable() {
  const ms = ensureMissions();
  return ms.list.filter(m => m.prog >= m.goal && !m.claimed).length + (ms.list.every(m => m.claimed) && !ms.chest ? 1 : 0);
}
function missions() {
  const ms = ensureMissions();
  const rows = ms.list.map((m, i) => {
    const def = MISSIONS.find(d => d.stat === m.stat), done = m.prog >= m.goal, rw = fmtN(missionReward(m));
    const btn = m.claimed ? '<button disabled>✓</button>' : done ? `<button data-m="${i}">🪙${rw}</button>` : `<button class="sec" disabled>🪙${rw}</button>`;
    return `<div class="up"><span class="ai">${['🟢', '🟡', '🔴'][m.tier]}</span><div class="info"><div class="n">${def.txt(m.goal)}</div>
      <div class="pbar"><i style="width:${m.prog / m.goal * 100}%"></i></div><div class="d">${fmtN(m.prog)} / ${fmtN(m.goal)}</div></div>${btn}</div>`;
  }).join('');
  const allClaimed = ms.list.every(m => m.claimed);
  const chest = `<div class="up"><span class="ai">🎁</span><div class="info"><div class="n">Daily Chest</div><div class="d">Claim all 3 missions to open it</div></div>
    ${ms.chest ? '<button disabled>✓</button>' : `<button id="chestb" ${allClaimed ? '' : 'disabled class="sec"'}>🪙${fmtN(chestReward())}</button>`}</div>`;
  const mid = new Date(); mid.setHours(24, 0, 0, 0);
  const mins = Math.max(1, Math.round((mid - Date.now()) / 60000));
  panel(`<h2>📋 Daily Missions</h2>${coinTag()}${rows}${chest}<div class="help">New missions in ${Math.floor(mins / 60)}h ${mins % 60}m. Unclaimed rewards expire at midnight.</div>`,
    [['Back', home, 'sec']]);
  ui.querySelectorAll('button[data-m]').forEach(b => b.onclick = () => {
    const m = ms.list[+b.dataset.m];
    if (m.claimed || m.prog < m.goal) return;
    m.claimed = true; save.coins += missionReward(m); persist(); initAudio(); SFX.daily(); missions();
  });
  const cb = document.getElementById('chestb');
  if (cb) cb.onclick = () => {
    if (ms.chest || !ms.list.every(m => m.claimed)) return;
    ms.chest = true; save.coins += chestReward(); persist(); initAudio(); SFX.win(); missions();
  };
}

// Fold a finished run into lifetime stats and today's missions; return new unlocks and missions just completed.
function commitRun(won) {
  const st = save.stats, before = new Set(save.unlocked);
  st.kills += g.kills;
  for (const k of ['dodges', 'gateBumps', 'rallies', 'evolves', 'fullBoss', 'muls', 'boosts', 'guardians']) st[k] = (st[k] || 0) + (g.st[k] || 0);
  if (won) { st.chapters++; if (g.st.sac) st.sacClears++; }
  for (const id in g.evo) if (!save.evoSeen.includes(id)) save.evoSeen.push(id);
  for (const id in UNLOCKS) if (!isUnlocked(id) && st[UNLOCKS[id].stat] >= UNLOCKS[id].goal) save.unlocked.push(id);
  const fresh = save.unlocked.filter(id => !before.has(id));
  if (fresh.length) save.armoryNew = true;
  // today's missions
  const ms = ensureMissions(), done = [];
  const runSt = { kills: g.kills, stages: g.st.stages + (won ? 1 : 0), dodges: g.st.dodges, choices: g.st.choices,
                  gateBumps: g.st.gateBumps, guardians: g.st.guardians, levelups: g.xpLv - 1, evolves: g.st.evolves };
  for (const m of ms.list) {
    const was = m.prog >= m.goal;
    m.prog = Math.min(m.goal, m.prog + (runSt[m.stat] || 0));
    if (!was && m.prog >= m.goal) done.push(m);
  }
  return { fresh, done };
}
// results-screen block: missions just completed, what just unlocked, and the closest next unlock to chase
function resultsExtras({ fresh, done, heroes = [] }) {
  let h = heroes.map(id => `<div class="unl">🎉 NEW HERO UNLOCKED<b>${HEROES[id].icon} ${HEROES[id].name}</b><span>${HEROES[id].role} · starts with ${SK[HEROES[id].weapon].icon} ${SK[HEROES[id].weapon].name}. Pick them in 🥷 Heroes on the home screen.</span></div>`).join('');
  h += done.map(m => `<div class="nextu" style="color:#7dffa0">📋 Mission complete: <b>${MISSIONS.find(d => d.stat === m.stat).txt(m.goal)}</b>. Claim it in Daily Missions!</div>`).join('');
  h += fresh.map(id => `<div class="unl">🔓 NEW ${SK[id].a ? 'WEAPON' : 'SKILL'} UNLOCKED<b>${SK[id].icon} ${SK[id].name}</b></div>`).join('');
  const next = Object.keys(UNLOCKS).filter(id => !isUnlocked(id)).map(id => ({ id, ...unlockProgress(id) })).sort((a, b) => b.p - a.p)[0];
  if (next) h += `<div class="nextu">Next unlock: <b>${SK[next.id].icon} ${SK[next.id].name}</b><br>${UNLOCKS[next.id].cond}${next.goal > 1 ? ` (${fmtN(next.cur)} / ${fmtN(next.goal)})` : ''}</div>`;
  return h;
}

function skins() {
  const rows = SKINS.map(s => {
    const owned = save.skins.includes(s.id), on = save.skin === s.id;
    const sw = `<span style="display:inline-block;width:26px;height:26px;border-radius:50%;background:${s.body};border:4px solid ${s.col};vertical-align:middle"></span>`;
    const btn = on ? '<button disabled>Equipped</button>'
      : owned ? `<button data-s="${s.id}" class="sec">Equip</button>`
      : `<button data-s="${s.id}" ${save.coins < s.cost ? 'disabled' : ''}>🪙${s.cost}</button>`;
    return `<div class="up">${sw}<div class="info"><div class="n">${s.name}</div><div class="d">${owned ? 'Owned' : 'Headband & garb'}</div></div>${btn}</div>`;
  }).join('');
  panel(`<h2>Ninja Skins</h2>${coinTag()}${rows}`, [['Back', home, 'sec']]);
  ui.querySelectorAll('button[data-s]').forEach(btn => btn.onclick = () => {
    const s = SKINS.find(k => k.id === btn.dataset.s);
    initAudio();
    if (!save.skins.includes(s.id)) { if (save.coins < s.cost) return; save.coins -= s.cost; save.skins.push(s.id); SFX.power(); } else SFX.click();
    save.skin = s.id; persist(); skins();
  });
}

function shop(back) {
  const rows = Object.keys(UPG).map(k => {
    const u = UPG[k], lv = save.up[k], maxed = lv >= MAXUP, c = upCost(k);
    const bar = `<div style="height:5px;background:#334;border-radius:3px;margin-top:5px"><div style="height:5px;width:${lv / MAXUP * 100}%;background:#ffb020;border-radius:3px"></div></div>`;
    return `<div class="up"><div class="info"><div class="n">${u.icon} ${u.name} <span style="color:#9aa6b2;font-weight:600;font-size:12px">Lv ${lv}/${MAXUP}</span></div><div class="d">${u.desc}</div>${bar}</div>
      <button data-k="${k}" ${maxed || save.coins < c ? 'disabled' : ''}>${maxed ? 'MAX' : '🪙' + c}</button></div>`;
  }).join('');
  panel(`<h2>Upgrades</h2>${coinTag()}${rows}`, [['Back', back, 'sec']]);
  ui.querySelectorAll('button[data-k]').forEach(btn => btn.onclick = () => {
    const k = btn.dataset.k, c = upCost(k);
    if (save.coins >= c && save.up[k] < MAXUP) { save.coins -= c; save.up[k]++; persist(); initAudio(); SFX.power(); shop(back); }
  });
}

// ---------- revive (once per run) ----------
// Placeholder for a rewarded-ad SDK. When the game ships as an app, show the ad here and call
// done(true) only if it was watched to the end. In the browser build the revive is free.
function showRewardedAd(placement, done) { done(true); }
const REVIVE_SECS = 7, REVIVE_SQUAD = .6, REVIVE_INVULN = 2.5;
function offerRevive() {
  running = false; dragX = null; g.reviveOpen = true; SFX.hurt();
  let left = REVIVE_SECS;
  panel(`<h2>💀 So close!</h2><p><b style="color:#ff6b6b">${g.lossCause || 'Your squad was wiped out'}.</b><br>
    Get back up with <b>${Math.round(g.cap * REVIVE_SQUAD)}</b> ninjas? (once per run)</p><div class="revt" id="revt">${left}</div>`,
    [['❤️ Revive', () => showRewardedAd('revive', ok => ok ? revive() : declineRevive())], ['Give up', declineRevive, 'sec']]);
  g.reviveTimer = setInterval(() => {
    const el = document.getElementById('revt'); if (el) el.textContent = --left;
    if (left <= 0) declineRevive();
  }, 1000);
}
function declineRevive() {
  if (!g || !g.reviveOpen) return;
  clearInterval(g.reviveTimer); g.reviveOpen = false; lose();
}
function revive() {
  if (!g || !g.reviveOpen) return;
  clearInterval(g.reviveTimer); g.reviveOpen = false; g.revived = true;
  g.count = Math.max(1, Math.round(g.cap * REVIVE_SQUAD)); g.lossCause = null; g.invuln = REVIVE_INVULN;
  // shockwave: wipe nearby enemies (no rewards) and every enemy shot; knock guardians and the boss back
  for (const o of g.objs) {
    if (o.dead) continue;
    const y = sy(o);
    if (o.k === 'en' && Math.abs(y - SQY) < 260) { o.dead = true; spark(o.x, y, '#ffffff', 6, 140); }
    else if (o.k === 'mini' && y > SQY - GUARD_Y_OFF - 60) {
      o.d = g.dist + GUARD_Y_OFF + 140; // back above the standoff line; it has to approach and hold again
      o.charging = false; o.warned = false; o.hold = undefined;
    } else if (o.k === 'boss' && g.bossMode && o.homeY !== undefined) { // only once the fight has started
      if (o.berserk) o.homeY = Math.min(o.homeY, 170); // undo the berserk advance
      o.state = 'idle'; o.d = g.dist + SQY - o.homeY; o.specT = Math.max(o.specT || 0, 3);
      o.hidden = false; o.alpha = 1; o.spT = Math.max(o.spT || 0, 2.5); // region bosses: reappear, next signature move later
    }
  }
  g.objs = g.objs.filter(o => !o.dead);
  g.ebullets = []; g.hz = []; // lane hazards (frost, thunder, waves) are washed away too
  g.evoFlash = .7;
 g.shake = .3; spark(g.sx, SQY, '#ffffff', 50, 260);
  g.banner = { txt: '❤️ REVIVED!', t: 1.4, gold: true };
  SFX.evolve();
  ui.innerHTML = ''; running = true;
}

// pause screen: build, synergy progress (active sets spelled out) and boons
function runInfoHtml() {
  const tags = Object.keys(TAGS).map(t => [t, tagCount(t)]).filter(([, n]) => n > 0).sort((a, b) => b[1] - a[1]);
  const chips = tags.map(([t, n]) => { const tier = setTier(n);
    return `<span class="${tier ? 'on' : ''}">${TAGS[t].icon} ${t} ${tier > 1 ? SET_AT[1] + '/' + SET_AT[1] + ' ★' : tier ? SET_AT[0] + '/' + SET_AT[0] + ' ✓' : n + '/' + SET_AT[0]}</span>`; }).join('');
  const sets = Object.keys(g.sets).map(t => `<div class="setl">${TAGS[t].icon} ${t} set${g.sets[t] > 1 ? ' ★' : ''}: ${TAGS[t].d[g.sets[t] - 1]}</div>`).join('');
  const boons = Object.keys(g.boons).map(b => `<div class="bnr"><span style="font-size:20px">${BOONS[b].icon}</span><span><b>${BOONS[b].name}</b><br>${BOONS[b].d}</span></div>`).join('');
  const h = HEROES[g.hero], hero = `<div class="bnr" style="background:#1a2230;border-color:${h.col}"><span style="font-size:20px">${h.icon}</span><span><b>${h.name}</b> · Mastery ${g.mastery}<br>${h.sig}: ${h.sd(g.mastery)}</span></div>`;
  return `<div class="notes" style="max-height:min(360px,50vh)">${hero}${buildHtml(g.sk, g.evo, null)}<div class="tags" style="justify-content:center;margin:0 0 6px">${chips}</div>${sets}${boons ? '<div class="sect" style="margin-top:10px">Boons</div>' + boons : ''}</div>`;
}
function pauseGame() {
  if (!running) return;
  running = false; dragX = null;
  panel('<h2>Paused</h2>' + runInfoHtml(), [['Resume', () => { ui.innerHTML = ''; running = true; }], ['Quit to menu', home, 'sec']]);
}

function bank(extra) {
  const mult = 1 + ECON.coinUp * save.up.coin, earned = Math.round((g.coins * g.G + extra) * mult);
  save.coins += earned; g.banked = true; persist(); return earned; // banked: the HUD stops adding run coins on top
}

// ---------- ×2 coins (rewarded ad on the results screens) ----------
// Run coins are only credited at the end of a run (bank), so doubling banks exactly that amount once more,
// never daily reward, mission or chest coins. Every results screen gets its own reward object whose state
// (open → pending while the ad plays → done) makes a second claim impossible: double taps, a screen re-opened
// from Upgrades, or a late ad callback all hit the state check.
let rewardSeq = 0;
const newReward = earned => ({ id: ++rewardSeq, earned, state: 'open' });
const rewardShown = r => ui.innerHTML.includes(`data-x2="${r.id}"`);
function claimDouble(r, rerender) {
  if (!r || r.state !== 'open' || !(r.earned > 0)) return false;
  r.state = 'pending';
  showRewardedAd('double', ok => {
    if (r.state !== 'pending') return;
    r.state = ok ? 'done' : 'open';
    if (ok) { save.coins += r.earned; persist(); initAudio(); SFX.daily(); }
    if (rerender && rewardShown(r)) rerender(); // only redraw if that results screen is still up
  });
  if (r.state === 'pending' && rerender && rewardShown(r)) rerender(); // the ad is still playing
  return true;
}
const earnedHtml = (r, txt) => r.state === 'done'
  ? `${txt} <b data-x2="${r.id}" class="x2done">🪙 ${fmtN(r.earned * 2)} <span>×2</span></b>`
  : `${txt} <b data-x2="${r.id}" style="color:#ffd84d">🪙 ${fmtN(r.earned)}</b>`;
const x2Btn = (r, rerender) => r.earned > 0 && r.state !== 'done'
  ? [[r.state === 'pending' ? '🎬 Loading…' : `🎬 ×2 Coins <small>(+🪙 ${fmtN(r.earned)})</small>`, () => claimDouble(r, rerender), 'ad']] : [];

function win() {
  if (g.practice) return practiceEnd(true);
  running = false; SFX.win();
  const c = g.c, left = g.count, kills = g.kills, sk = g.sk, evo = g.evo, run = commitRun(true), earned = bank(ECON.clearPer * g.lv + left), rw = newReward(earned);
  save.chapter = c + 1; save.bestStage = 0; run.heroes = checkHeroUnlocks(); persist();
  if (run.fresh.length || run.done.length || run.heroes.length) setTimeout(() => SFX.daily(), 600);
  const champ = c === MAX_CHAPTER ? `<p style="color:#ffd84d"><b>🏆 You beat all ${MAX_CHAPTER} chapters! You are a true ninja master. Endless mode unlocked.</b></p>` : '';
  // the next chapter opens a new region: celebrate it like an unlock
  const nr = regionFirst(c + 1) ? regionOf(c + 1) : null, bt = g.bt;
  const reach = nr ? `<div class="unl" style="border-color:${nr.col}">🗺️ NEW REGION REACHED<b>${regionTag(c + 1)}</b><span>${regionTw(c + 1)}${nr.boss !== undefined ? ` Boss: ${bossName(nr.boss)}.` : ''}</span></div>` : '';
  const after = () => panel(`<h1>CHAPTER ${c} <span>CLEARED</span></h1>${champ}${reach}<p>${bossName(bt)} defeated with <b>${left}</b> ninjas left.<br>${regionTag(c)} · ⚔ <b>${kills}</b> enemies defeated<br>${earnedHtml(rw, 'You earned')}</p>${buildHtml(sk, evo)}${resultsExtras(run)}${coinTag()}`,
    [...x2Btn(rw, after), ['▶ Next Chapter', play], ['Upgrades', () => shop(after), 'sec third'], ['Menu', home, 'sec third']]);
  after();
}

function lose() {
  if (g.practice) return practiceEnd(false);
  running = false; SFX.lose();
  const c = g.c, stage = g.stage, kills = g.kills, sk = g.sk, evo = g.evo, cause = g.lossCause || 'Your squad was wiped out', run = commitRun(false), earned = bank(0), rw = newReward(earned);
  save.bestStage = Math.max(save.bestStage, stage); persist();
  if (run.fresh.length || run.done.length) setTimeout(() => SFX.daily(), 900);
  const after = () => panel(`<h1>CLAN <span>DEFEATED</span></h1><p><b style="color:#ff6b6b">${cause}.</b><br>${regionTag(c)} · Chapter <b>${c}</b> · reached <b>stage ${stage}/${STAGES}</b> · ⚔ <b>${kills}</b> defeated<br>${earnedHtml(rw, 'You still earned')} — spend it on upgrades.</p>${buildHtml(sk, evo)}${resultsExtras(run)}${coinTag()}`,
    [...x2Btn(rw, after), ['↻ Try Again', play], ['Upgrades', () => shop(after), 'sec third'], ['Menu', home, 'sec third']]);
  after();
}

// ---------- loop ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.033, (now - last) / 1000); last = now;
  if (running && g) {
    // evolutions play in slow motion for a moment (real time, not game time)
    if (g.slow > 0) { g.slow -= dt; update(dt * .3); } else update(dt);
  }
  if (!g) idleDist += 60 * dt;
  draw();
  requestAnimationFrame(frame);
}
loadArt();
home();
requestAnimationFrame(frame);
})();
</script>
