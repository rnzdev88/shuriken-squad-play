<body>
<canvas id="c"></canvas>
<div id="ui"></div>
<script>
(() => {
const cv = document.getElementById('c'), cx = cv.getContext('2d'), ui = document.getElementById('ui');
const W = 400; let H = 700, S = 1;
const RL = 40, RR = 360, MID = 200, SPEED = 130;
let SQY = 550;

function resize() {
  const iw = innerWidth, ih = innerHeight;
  H = Math.max(620, Math.min(900, W * ih / iw));
  S = Math.min(iw / W, ih / H);
  const d = window.devicePixelRatio || 1;
  cv.width = Math.round(W * S * d); cv.height = Math.round(H * S * d);
  cv.style.width = W * S + 'px'; cv.style.height = H * S + 'px';
  cv.style.marginTop = Math.max(0, (ih - H * S) / 2) + 'px';
  cx.setTransform(S * d, 0, 0, S * d, 0, 0);
  SQY = H - 150;
}
addEventListener('resize', resize); resize();

// Gameplay randomness goes through R, which newGame() seeds so a seed always rebuilds the same chapter.
// Purely visual randomness (particles, shake) uses frnd so it never shifts the gameplay sequence.
function makeRng(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
let R = Math.random;
const rnd = (a, b) => a + R() * (b - a);
const ri = (a, b) => Math.floor(rnd(a, b + 1));
const pick = a => a[Math.floor(R() * a.length)];
const frnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

// ---------- patch notes ----------
// Newest first. Bump GAME_VERSION and add an entry for every player-facing update;
// returning players see the notes once, new players only see the "What's New" button.
const GAME_VERSION = '1.8';
// Playtest build: every hero is owned from the start so testers can try them all.
// Set to false for release; heroes then unlock at their chapter (HEROES[id].unlock).
const TESTER_ALL_HEROES = true;
const PATCH_NOTES = [
  { v: '1.8', title: 'Heroes', date: 'Nov 2026', notes: [
    ['🥷', '<b>Heroes:</b> choose who leads your squad with the new hero button above Play. Each hero starts with a different weapon and has a signature skill.'],
    ['🦊', '<b>Tsubaki</b> (clear Chapter 4) starts with Fire Talisman and counts as an extra 🔥 Fire skill. Burning enemies take extra damage from everything.'],
    ['🐻', '<b>Goro</b> (clear Chapter 10) starts with Kusarigama and leads a bigger clan: more squad size, + gates recruit more, and he counts as an extra 🐝 Swarm skill. He throws a bit slower.'],
    ['✦', '<b>Hero Mastery:</b> spend coins to strengthen your hero\'s signature skill, up to level 5. Upgrades still power up every hero.'],
    ['🧪', '<b>Playtest:</b> all 3 heroes are unlocked for you right now so you can try them. In the full game they unlock as you progress.'],
  ] },
  { v: '1.7', title: 'Boons & Synergies', date: 'Nov 2026', notes: [
    ['🧬', '<b>Synergy sets:</b> every skill now has tags like 🔥 Fire, 🛡️ Steel or 🐝 Swarm. Own 3 skills with the same tag for a set bonus, and 4 for an even stronger ★ version. Skill cards show your progress.'],
    ['👑', '<b>Boons:</b> beating your 1st and 3rd guardian each chapter lets you pick a Boon, a powerful twist that lasts the whole run: Momentum, Last Stand, Gate Echo, Blood Pact and more.'],
    ['👥', '<b>New weapon: Smoke Clones.</b> Shadow clones fight beside your squad. Unlock them by running through ×2 or ×3 gates. Max them with the Abacus to evolve <b>Shadow Legion</b>, where every × gate multiplies your clones too.'],
    ['🎬', '<b>×2 Coins:</b> after any run, double the coins you earned from the results screen.'],
    ['💾', '<b>Save backup:</b> tap 💾 Save at the bottom of the home screen to copy a code with all your progress. On a new phone or browser, paste it into Restore to pick up where you left off.'],
    ['⚖️', 'Thousand Stars is a little weaker; Raijin\'s Drum, Phoenix Seal and Iron Cyclone hit harder. Enemies in later stages and bosses are tougher to match your new powers.'],
    ['🐛', 'Fixed: the coin counter could briefly show more coins than you had right after a run.'],
  ] },
  { v: '1.6', title: 'Second Wind & Daily Missions', date: 'Nov 2026', notes: [
    ['❤️', '<b>Revive:</b> once per run, when your squad falls you can get back up with 60% of your squad. A shockwave clears nearby enemies, guardians and bosses get knocked back, and you\'re untouchable for a moment.'],
    ['📋', '<b>Daily Missions:</b> 3 new goals every day (easy, medium, hard), like defeating enemies, dodging charges or shooting gates up. Each one pays coins, and finishing all 3 opens the <b>🎁 Daily Chest</b>.'],
    ['✅', 'The results screen tells you when a run completes a mission. Claim your rewards from Daily Missions on the home screen.'],
    ['🔊', 'Sound on/off moved to the bottom of the home screen.'],
  ] },
  { v: '1.5', title: 'The Armory', date: 'Nov 2026', notes: [
    ['🔓', '<b>Earn your arsenal:</b> you now start with a small kit (Shuriken Volley, Kunai Line, Headband, Whetstone, Iron Tabi). Every other weapon and skill is unlocked by completing a challenge, like dodging charges, shooting gates, or clearing a chapter after a sacrifice.'],
    ['⚔️', '<b>Armory</b> (home menu): see every skill, what unlocks the locked ones, your progress, and the evolutions you\'ve discovered.'],
    ['✨', 'Your next unlock and its progress show after every run. Skill cards also tell you when an evolution needs a skill you haven\'t unlocked yet.'],
    ['🪙', '<b>Economy rebalance:</b> upgrades were maxing out far too fast. Coin Bonus is now +5% per level, upgrades cost more as they level up, and the endless enemy stream gives XP but no coins. Your coins and upgrades are kept.'],
    ['⚖️', 'The first chapters are a little gentler while you build your arsenal.'],
    ['🐛', 'Fixed: setting a treasure chest on fire with a Fire Talisman could make its flames glitch.'],
  ] },
  { v: '1.4', title: 'Boss Battles', date: 'Nov 2026', notes: [
    ['👹', '<b>Real boss fights:</b> bosses no longer just walk at you. They hold their ground and attack, then lock onto your lane. A <b style="color:#ff6b6b">red strip</b> shows where they\'re about to charge, so sidestep!'],
    ['😡', '<b>Enraged:</b> at half health a boss gets angry, with faster attacks, more projectiles and quicker charges. The Iron Samurai\'s guards bring shields.'],
    ['⏱️', '<b>Don\'t stall:</b> after 40 seconds the boss goes <b>Berserk</b> and advances. Finish it before it reaches you!'],
    ['⚖️', 'Bosses are much tougher, so a good build really matters now. The first few chapters\' bosses are gentler while you learn.'],
  ] },
  { v: '1.3', title: 'Endless Waves', date: 'Nov 2026', notes: [
    ['🌊', '<b>Endless waves:</b> enemies now pour in nonstop during every stage, and the flood gets thicker toward the end.'],
    ['👹', '<b>Guardians are deadly:</b> one touch from a guardian or the boss ends your run. Guardians stop in front of you and attack, which is your chance to take them down. If one flashes red and shouts <b>CHARGE!</b>, dodge sideways.'],
    ['🐛', 'Fixed: guardians and enemies could hide behind gates where your stars couldn\'t reach them. Stars now fly through gates (and still raise their number on the way).'],
    ['🐛', 'Fixed: Shadow Twins no longer split right on top of your squad.'],
    ['⚔️', 'The results screen now shows how many enemies you defeated.'],
    ['⚖️', 'Leveling up takes a bit more XP, since there are far more enemies now. Enemies are slightly tougher.'],
  ] },
  { v: '1.2', title: 'Choice Gates & Evolutions', date: 'Nov 2026', notes: [
    ['✨', '<b>Evolutions!</b> Max out a weapon while you own its partner skill and a <b>Golden Torii</b> appears. Run through it to evolve. 5 evolutions to discover, and skill cards show which skills go together.'],
    ['🟪', '<b>Choice Gates:</b> gold gates where every lane is good. Recruit ninjas, refill your squad, grab a new skill (costs 30% of your squad), sacrifice half your squad for ×1.5 damage, or take coins.'],
    ['🚩', '<b>War Banner</b> (new skill): a bigger squad, and extra damage while it\'s full.'],
    ['⚔️', '<b>Ronin Spirit</b> (new skill): fallen ninjas keep fighting as ghosts. Small squads hit hard!'],
    ['⚖️', 'Enemies are tougher to match your new powers. The first few bosses are gentler.'],
  ] },
  { v: '1.1', title: 'Chapters & Skills', date: 'Nov 2026', notes: [
    ['📖', '<b>Levels are now Chapters:</b> 5 stages, then a boss. Your squad and skills carry through the whole chapter. Your progress was converted (5 old levels = 1 chapter).'],
    ['🃏', '<b>Level up mid-run:</b> defeat enemies to earn XP, then pick 1 of 3 skills. 5 weapons and 6 passive skills to mix.'],
    ['🛡️', '<b>Guardians</b> block the end of each stage. Beat one for a bonus skill pick.'],
    ['🥷', '<b>Squad size cap:</b> once your squad is full, POWER and SPEED gates are the smart pick. The Starting Ninjas upgrade now raises the cap too.'],
    ['⚖️', 'POWER and SPEED gates now stack all chapter long. You start with 8 ninjas instead of 5.'],
    ['🐛', 'SPEED gates no longer lower your throw speed when upgrades have already made it very high.'],
  ] },
];

// ---------- save data ----------
const STAGES = 5, MAX_CHAPTER = 100;
const SAVE_KEY = 'gatesquad_v1';
const saveDefaults = () => ({ chapter: 1, bestStage: 0, coins: 0, sound: true, up: { troops: 0, rate: 0, dmg: 0, coin: 0 },
             skins: ['azure'], skin: 'azure', daily: { last: '', streak: 0 }, seenVersion: '', hero: 'kage', heroes: { kage: 1 } });
// `save` is only ever filled in place (see loadSave), so it is safe to hold on to.
const save = saveDefaults();
let storedSave = null;
try { storedSave = JSON.parse(localStorage.getItem(SAVE_KEY)); } catch (e) {}

// ---------- unlocks (earned, Vampire Survivors style) ----------
// Players start with a small kit; everything else is earned through lifetime challenges, each teaching a mechanic.
// Kusarigama (dodging) + Iron Tabi (starter) is the intended first evolution.
const STARTER = ['volley', 'kunai', 'headband', 'whetstone', 'tabi'];
const UNLOCKS = {
  talisman: { stat: 'chapters',   goal: 1,    cond: 'Clear any chapter' },
  chain:    { stat: 'dodges',     goal: 3,    cond: 'Dodge 3 guardian or boss charges' },
  abacus:   { stat: 'gateBumps',  goal: 30,   cond: 'Raise gate numbers by shooting them 30 times' },
  seal:     { stat: 'kills',      goal: 1000, cond: 'Defeat 1,000 enemies' },
  gourd:    { stat: 'rallies',    goal: 5,    cond: 'Take the ⛺ Rally lane 5 times' },
  mirror:   { stat: 'evolves',    goal: 1,    cond: 'Evolve any weapon' },
  banner:   { stat: 'fullBoss',   goal: 1,    cond: 'Reach a boss with a full squad' },
  ronin:    { stat: 'sacClears',  goal: 1,    cond: 'Clear a chapter after taking a ÷2 Sacrifice lane' },
  clones:   { stat: 'muls',       goal: 8,    cond: 'Run through ×2 or ×3 gates 8 times' }, // teaches multipliers, Shadow Legion's trick
};
// ---------- heroes (M5) ----------
// The leader of the squad. Heroes are sidegrades, not a second power ladder: the 4 account upgrades stay the shared
// power progression, and a hero only changes how a run starts and which builds it leans toward.
//   weapon: the run starts with it at Lv 1 instead of Shuriken Volley (usable even if the Armory hasn't unlocked it)
//   tag:    counts as one extra skill with that synergy tag, so 2 more tagged skills complete the set
//   v(m):   signature strength at mastery m (1-5). Mastery is a small coin sink: max mastery is worth well under +10% power.

// ---------- difficulty curve ----------
// Chapter c, stage s plays at tier lv = (c-1)*STAGES + s, so the original 500-level curve spans 100 chapters.
const tierOf = (c, s) => (c - 1) * STAGES + s;
// G: "scale" of the game in ninjas. Gate values, enemy HP and damage all grow with it.
const Gs = lv => 1 + 0.15 * (lv - 1);
// D: 0..1 difficulty ramp (density, speed, aggression) that maxes out at tier 300
const Dr = lv => Math.min(1, (lv - 1) / 300);
// Pw: the power a steady player has bought by this tier (damage × throw rate × squad cap upgrades), with 40% slack,
// so a player who keeps up feels ahead of the curve. It depends only on the tier, never on what the player owns,
// so replaying an old chapter after upgrading feels like crushing it.
const upExp = lv => Math.min(50, (lv - 1) / 7);
const Pw = lv => { const u = upExp(lv); return Math.max(1, (1 + .06 * u) * (1 + .15 * u) * (1 + .1 * u) * .6); };
// The crowd and build snowball within a chapter, so later stages get a steep HP ramp (SR) to keep pace.
// M4: 1.9 → 2.0 per stage, since boons (after guardians 1 and 3) and set bonuses add their power as the run goes on.
const SR = s => .6 * Math.pow(2.0, s - 1);
// gentle intro: tiers 1-15 ramp from 45% to full strength (new players start with only the starter kit)
// HPK: global enemy-HP knob, retuned whenever in-run power changes (M3: choice gates + evolutions; M4: boons + set bonuses, 1.8 → 2.0)
const HPK = 2.0;
// BOSS_HPK: extra boss HP so the phased boss fight lasts ~20-40 s instead of a 5 s damage check (M4: 3 → 3.2)
const BOSS_HPK = 3.2;
const Hm = (lv, s = 1) => HPK * Gs(lv) * (1 + 0.7 * Dr(lv)) * Pw(lv) * (0.45 + 0.55 * Math.min(1, (lv - 1) / 15)) * SR(s);
const lanesFor = lv => lv < 15 ? 2 : lv < 60 ? 3 : lv < 150 ? 4 : 5;
// ninjas lost to a hit; grows with the stage at the same rate as the squad cap so late hits still sting
const loss = (base, lv) => Math.max(1, Math.round(base * Gs(lv) * (g ? 1 + .3 * (g.stage - 1) : 1)));
const stageLen = c => 3000 + Math.min(c - 1, 8) * 400;

function gateSide(lv, good) {
  const G = Gs(lv), D = Dr(lv);
  if (good) {
    const t = pick(['add', 'add', 'add', 'add', 'mul', 'rate', 'dmg']);
    if (t === 'add') return { t, v: Math.round(ri(3, 8) * G), acc: 0 };
    if (t === 'mul') return { t, v: R() < .2 ? 3 : 2 };
    return { t };
  }
  if (R() < 0.75) return { t: 'add', v: -Math.round(ri(3, 8) * G * (1 + D)), acc: 0 };
  return { t: 'div', v: R() < D * .5 ? 3 : 2 };
}

// Choice Gate: every lane is good, in a different situation. There is always a skill lane and a squad lane;
// the rest are drawn from the remaining types.
//  add (big +N) / rally (refill to cap): when the squad is low
//  skill: a draft pick now, for 30% of the squad (best when the squad is near full)
//  sac: halve the squad for ×1.5 damage (Elite / Ronin builds)
//  gold: coins for upgrades (greed)
function choiceGate(lv, lanes) {
  const G = Gs(lv);
  const make = t => t === 'add' ? { t, v: Math.round(ri(9, 15) * G), acc: 0, ch: 1 }
    : t === 'gold' ? { t, v: ri(15, 25), ch: 1 } : { t, ch: 1 };
  const types = ['skill', pick(['add', 'rally'])];
  const rest = ['add', 'rally', 'sac', 'gold'].filter(t => !types.includes(t));
  while (types.length < lanes) types.push(rest.length ? rest.splice(Math.floor(R() * rest.length), 1)[0] : 'skill');
  for (let i = types.length - 1; i > 0; i--) { const j = Math.floor(R() * (i + 1)); [types[i], types[j]] = [types[j], types[i]]; }
  return types.map(make);
}

// One stage of a chapter: a stage marker, then gates/enemies/spikes/chests, then a guardian (except the last stage).
function genStage(c, s, d0, objs) {
  const lv = tierOf(c, s), G = Gs(lv), D = Dr(lv), H = Hm(lv, s), lanes = lanesFor(lv), lw = (RR - RL) / lanes;
  const pus = ['spread', 'troops', 'rate', 'smoke', 'fire'];
  const end = d0 + stageLen(c);
  objs.push({ k: 'stage', s, lv, d: d0 });
  let d = d0 + 360, k = 0, gi = 0;
  while (d < end) {
    let kind = k % 3 === 0 ? 'gate' : (k % 3 === 1 ? 'enemies' : pick(['crate', 'enemies', 'gate']));
    if (lv >= 2 && k % 3 === 2 && R() < Math.min(.55, .3 + D * .3)) kind = 'spike';
    if (kind === 'gate' && gi++ % 3 === 1) {
      objs.push({ k: 'gate', choice: true, d, opts: choiceGate(lv, lanes), used: false });
    } else if (kind === 'gate') {
      // at least one good lane; fewer good lanes as difficulty rises
      const nGood = Math.max(1, Math.round((lanes - 1) * (1 - D * .6) * rnd(.5, 1)));
      const goodIdx = new Set();
      while (goodIdx.size < Math.min(nGood, lanes)) goodIdx.add(ri(0, lanes - 1));
      const opts = Array.from({ length: lanes }, (_, i) => gateSide(lv, goodIdx.has(i)));
      objs.push({ k: 'gate', d, opts, used: false });
    } else if (kind === 'enemies') {
      const n = ri(2, 4 + Math.floor(6 * D)), hp = 3.5 * H; // small escort: the endless stream supplies the bulk
      for (let i = 0; i < n; i++) objs.push({ k: 'en', d: d + rnd(0, 140), x: rnd(RL + 15, RR - 15), hp, max: hp, r: 10, ph: rnd(0, 6) });
      if (R() < Math.min(.9, .3 + lv * .03)) {
        const nb = 1 + Math.floor(D * 3);
        for (let i = 0; i < nb; i++) { const bh = 34 * H; objs.push({ k: 'en', big: true, d: d + 170 + i * 40, x: rnd(RL + 40, RR - 40), hp: bh, max: bh, r: 20, ph: 0 }); }
      }
      if (lv >= 2 && R() < Math.min(.9, .45 + lv * .01)) {
        const na = Math.min(5, 1 + Math.floor(lv / 15)), ah = 6 * H;
        for (let i = 0; i < na; i++) objs.push({ k: 'en', archer: true, d: d + 200 + i * 30, x: rnd(RL + 25, RR - 25), hp: ah, max: ah, r: 11, ph: rnd(0, 6), hold: 4.5, shotT: rnd(.6, 1.4) });
      }
      if (lv >= 5 && R() < Math.min(.8, .3 + lv * .01)) {
        const ns = ri(1, Math.min(6, 1 + Math.floor(lv / 10))), sh = 8 * H;
        for (let i = 0; i < ns; i++) objs.push({ k: 'en', shield: 18 * H, smax: 18 * H, d: d + 60 + i * 25, x: rnd(RL + 25, RR - 25), hp: sh, max: sh, r: 12, ph: rnd(0, 6) });
      }
    } else if (kind === 'spike') {
      // spike whole lanes, always leaving at least one lane safe
      const nSp = Math.max(1, Math.min(lanes - 1, Math.round((lanes - 1) * rnd(.4, .6 + D * .4))));
      const idx = new Set(); while (idx.size < nSp) idx.add(ri(0, lanes - 1));
      for (const i of idx) objs.push({ k: 'spike', d, x0: RL + i * lw + 2, x1: RL + (i + 1) * lw - 2 });
      const safe = [...Array(lanes).keys()].filter(i => !idx.has(i));
      if (R() < .5) { const s = pick(safe); objs.push({ k: 'crate', d: d + 120, x: RL + (s + .5) * lw, hp: 19 * H, max: 19 * H, pu: pick(pus) }); }
    } else {
      objs.push({ k: 'crate', d, x: rnd(RL + 40, RR - 40), hp: 19 * H, max: 19 * H, pu: pick(pus) });
    }

  }

  // stage guardian: beating it grants a bonus skill pick
  const t = (c + s - 2) % 3, mh = Math.round(1750 * H * .28);
  objs.push({ k: 'mini', t, d: end + 120, x: rnd(RL + 60, RR - 60), hp: mh, max: mh, r: 28, ph: 0, atkT: 2 });
  return end + 560;
}

function genChapter(c) {
  const objs = [], stageD = [];
  let d = 260;
  const waves = [];
  for (let s = 1; s <= STAGES; s++) {
    stageD.push(d);
    // the endless enemy stream runs from just after the stage starts until the guardian (or boss) zone
    waves.push({ s, from: d + 200, to: d + stageLen(c) });
    d = genStage(c, s, d, objs);
  }
  const lv = tierOf(c, STAGES), bt = (c - 1) % 3;
  // the first few bosses are softened so new players reach the build-up before the wall
  const bh = Math.round(1750 * BOSS_HPK * Hm(lv, STAGES) * BOSSES[bt].hp * (c % 10 === 0 ? 1.5 : 1) * Math.min(1, .3 + .175 * (c - 1)));
  objs.push({ k: 'boss', bt, d: d + 520, x: MID, hp: bh, max: bh, r: 46, ph: 0, atkT: 2 });
  return { objs, stageD, waves, L: d + 520 };
}

let dragX = null; const keys = {};

// ---------- update ----------
function update(dt) {

  g.sx = clamp(g.sx, RL + 16, RR - 16);
  const r = squadR();

  const boss = g.objs.find(o => o.k === 'boss');
  if (boss && !g.bossMode && sy(boss) >= 170) {
    g.bossMode = true; g.banner = { txt: '⚠ ' + BOSSES[boss.bt].name + ' ⚠', t: 1.8, red: true }; SFX.boss();
    if (g.count >= g.cap) g.st.fullBoss = 1;
    // the path stops scrolling for the boss, so any torii still on its way evolves now
    for (const o of g.objs) if (o.k === 'torii' && !o.dead) { o.dead = true; evolve(o.evo); }
  }
  const miniNear = g.objs.some(o => o.k === 'mini' && !o.dead && sy(o) > 100 && sy(o) < SQY - 140);
  const scroll = g.bossMode ? 0 : g.speed * (miniNear ? .3 : 1) * dt;
  g.dist += scroll;
  spawnStream(dt);
  for (const k of ['spread', 'shake', 'hurt', 'flash', 'smoke', 'fire', 'evoFlash', 'invuln']) if (g[k] > 0) g[k] -= dt;
  if (g.banner) { g.banner.t -= dt; if (g.banner.t <= 0) g.banner = null; }
  if (g.sets.Shadow && (g.shT -= dt) <= 0) { // Shadow set: vanish in smoke now and then
    g.shT = g.sets.Shadow > 1 ? 8 : 12; g.smoke = Math.max(g.smoke, 2); pop(g.sx, SQY - 60, '🌑 VANISH', '#c79bff'); SFX.smoke();
  }

  // fire

  g.momT += dt; g.ovfPop = (g.ovfPop || 0) - dt;
  const rate = Math.min(24, g.rate * (1 + .1 * skl('headband')) * (1 + momBonus()));
  while (g.fireT <= 0 && g.count > 0) {
    g.fireT += 1 / rate;
    const fire = g.fire > 0, evo = g.evo.volley; // Thousand Stars: more stars, +30% damage, each pierces once
    const n = Math.min(g.count, evo ? 18 : 10), dmg = power() * (1 + volleyBonus(skl('volley'))) * (1 + heroSig('kage')) * (evo ? 1.3 : 1) / n * (g.spread > 0 ? 1.2 : 1) * (fire ? 1.8 : 1);
    for (let i = 0; i < n; i++) {
      const f = n > 1 ? i / (n - 1) - 0.5 : 0;
      g.bullets.push({ x: g.sx + f * r * 1.4, y: SQY - r * 0.6, vx: g.spread > 0 ? f * 300 : 0, vy: -560, dmg, a: Math.random() * 6, fire, gold: evo, pierce: evo ? 1 : 0 });
    }

  // move objects

    const y = sy(o);

      // archer plants its feet and fires arrows for a few seconds

      o.shotT -= dt;
      if (o.shotT <= 0) { o.shotT = 1.5 * (1 - .4 * g.D); enemyShot(o.x, y, 'arrow', 260 * (1 + .3 * g.D)); SFX.arrow(); }
    } else if (o.k === 'en' && y > -40) {

        if (o.hold <= 0) o.charging = true;

        if (o.t === 1 && o.atkT <= 0 && y > 80) { o.atkT = 1.7 * (1 - .4 * g.D); enemyShot(o.x, y + 20, 'bomb', 190 * (1 + .3 * g.D)); SFX.arrow(); }
        if (o.t === 2 && o.atkT <= 0 && y > 80) { o.atkT = 2.4 * (1 - .4 * g.D); enemyShot(o.x, y + 10, 'arrow', 280); }

  const ignite = g.sets.Fire ? power() * (g.sets.Fire > 1 ? .25 : .15) : 0; // Fire set: burn damage per second

        // (Gates used to absorb stars, which shielded guardians and enemies walking in behind them.)
        if (o.used || o === b.lastGate || Math.abs(b.y - oy) > 22) continue;
        b.lastGate = o;
        const s = o.opts[laneOf(b.x, o.opts.length)];
        if (s.t === 'add') { s.acc += 1; if (s.acc >= 6) { s.acc = 0; s.v += Math.max(1, Math.round(g.G)); s.bump = .15; g.st.gateBumps++; } }

      if (Math.abs(b.x - o.x) < rr && Math.abs(b.y - oy) < rr) {

  // enemy projectiles
  for (const e of g.ebullets) {
    if (e.dead) continue; // smashed by Iron Cyclone
    e.x += e.vx * dt; e.y += e.vy * dt; e.a += dt * 8;
    if (e.y > H + 20 || e.x < -20 || e.x > W + 20) { e.dead = true; continue; }
    const hitR = (e.kind === 'rock' || e.kind === 'bomb') ? 14 : 6;
    if (Math.abs(e.x - g.sx) < r * .8 + hitR && Math.abs(e.y - SQY) < r * .5 + hitR) {
      e.dead = true; hurtSquad(loss(e.kind === 'rock' ? 4 : e.kind === 'bomb' ? 2 : e.kind === 'feather' ? 2 : 1, g.lv), e.x, e.y, true);
    }

  g.ebullets = g.ebullets.filter(e => !e.dead);

  // collisions with squad
  for (const o of g.objs) {
    if (o.dead) continue;
    const y = sy(o);
    if (o.k === 'stage') { if (y >= SQY) { o.dead = true; enterStage(o); } continue; }
    if (o.k === 'torii') { if (y >= SQY) { o.dead = true; evolve(o.evo); } continue; }
    if (o.k === 'gate' && !o.used && y >= SQY) { o.used = true; applyGate(o.opts[laneOf(g.sx, o.opts.length)]); }
    else if (o.k === 'mini' && g.invuln <= 0 && Math.abs(y - SQY) < r * .7 + o.r && Math.abs(o.x - g.sx) < r + o.r) {

    else if (o.k === 'en' && Math.abs(y - SQY) < r * 0.7 + o.r && Math.abs(o.x - g.sx) < r + o.r) {
      o.dead = true; hurtSquad(loss(o.big ? 6 : o.smax ? 2 : 1, g.lv), o.x, y);
    } else if (o.k === 'spike' && !o.hit && Math.abs(y - SQY) < 14 && g.sx + r * .6 > o.x0 && g.sx - r * .6 < o.x1) {

  for (const p of g.parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 300 * dt; p.t -= dt; }

  g.pops = g.pops.filter(p => p.t > 0);
  for (const o of g.objs) if (o.k === 'gate') for (const s of o.opts) if (s.bump > 0) s.bump -= dt;

    if (g.regenT <= 0) { g.regenT = 4; const n = addNinjas(gourdN(skl('gourd'))); if (n) pop(g.sx + 30, SQY - 50, '+' + n + ' 🍶', '#7dffa0'); }

// ---------- boss fight ----------
// The boss holds near the top and fights in phases instead of walking into the squad:
//   idle (its attack pattern) → telegraph: locks onto your lane, red strip on the ground → charge down it → return.
//   Touching the boss is defeat, so every charge is telegraphed and can be sidestepped.
//   Below 50% HP it ENRAGES (roar, faster attacks, shorter warnings, extra projectiles).
//   After BOSS_TIME seconds it goes BERSERK and advances; reaching the squad's row overruns the clan.
const BOSS_TIME = 40, BOSS_TELE = 1.3, BOSS_CHARGE_V = 560, BOSS_RETURN_V = 300, BOSS_CREEP_V = 14;
function updateBoss(o, y, dt) {

  const rage = o.phase === 2, D = g.D, spd = (rage ? .7 : 1) * (1 - .4 * D); // attack cooldown multiplier
  o.ph += dt * 4; o.fightT = (o.fightT || 0) + dt;
  if (o.homeY === undefined) { o.homeY = y; o.state = 'idle'; o.specT = 4; }
  if (!rage && o.hp <= o.max / 2) {
    o.phase = 2; o.state = 'roar'; o.stT = .9; setY(o.homeY);
    g.banner = { txt: BOSSES[o.bt].name + ' ENRAGED!', t: 1.4, red: true, small: true }; SFX.boss(); g.shake = .45;
    return;
  }
  if (!o.berserk && o.fightT > BOSS_TIME) {
    o.berserk = true;
    g.banner = { txt: '⚠ BERSERK ⚠', sub: 'Finish it before it reaches you!', t: 1.8, red: true }; SFX.boss();
  }

      if (o.stT <= 0) { o.state = 'charge'; SFX.boom(); g.shake = .25; }
      return;
    case 'charge': setY(y + BOSS_CHARGE_V * dt); if (y > SQY + 70) o.state = 'return'; return;
    case 'return': { const ny = Math.max(o.homeY, y - BOSS_RETURN_V * dt); setY(ny); if (ny <= o.homeY) { o.state = 'idle'; g.st.dodges++; } return; }
  }
  // idle: hold position and use this boss's pattern
  setY(o.homeY);
  o.atkT -= dt; o.specT -= dt;
  if (o.bt === 1) { // Tengu: sways across the path, fans of feathers
    const tx = MID + Math.sin(o.ph * (rage ? .55 : .35)) * 110;
    o.x += (tx - o.x) * Math.min(1, dt * 3);
    if (o.atkT <= 0) {
      o.atkT = 1.8 * spd;
      const fan = rage ? [-.6, -.3, 0, .3, .6] : D > .5 ? [-.45, -.15, .15, .45] : [-.3, 0, .3];
      for (const a of fan) enemyShot(o.x, y + 20, 'feather', 230 * (1 + .3 * D), a);
      SFX.arrow();
    }
  } else {
    // Oni and Samurai drift toward the squad so their attacks stay aimed
    o.x += clamp(g.sx - o.x, -1, 1) * Math.min(Math.abs(g.sx - o.x), 30 * dt);
    if (o.bt === 0 && o.atkT <= 0) { // Oni: boulders (a spread of three when enraged)
      o.atkT = 2.2 * spd;
      for (const a of (rage ? [-.25, 0, .25] : [0])) enemyShot(o.x, y + 30, 'rock', 200 * (1 + .3 * D), a);
    } else if (o.bt === 2 && o.atkT <= 0) { // Iron Samurai: summons a line of guards (shielded when enraged)
      o.atkT = 3.5 * spd;
      const H2 = Hm(g.lv, g.stage), hp = 3.5 * H2;
      for (let i = -1; i <= 1 + Math.floor(D * 2); i++) {
        const e = { k: 'en', d: o.d - 50, x: clamp(o.x + i * 50, RL + 15, RR - 15), hp, max: hp, r: 10, ph: rnd(0, 6) };
        if (rage) { e.shield = e.smax = 18 * H2; e.hp = e.max = 8 * H2; e.r = 12; }
        g.objs.push(e);
      }
      SFX.bad();
    }
  }
  if (o.specT <= 0) {
    // lock onto the squad's lane and warn before charging
    o.state = 'tele'; o.stT = BOSS_TELE * (rage ? .75 : 1) * (1 - .25 * D);
    o.lane = clamp(g.sx, RL + o.r, RR - o.r);
    o.specT = (rage ? 4.5 : 6.5) * (1 - .3 * D) * (o.berserk ? .6 : 1);
    SFX.boss();
  }
}

// ---------- endless enemy stream ----------
// Basic ninjas pour in nonstop during each stage and get denser toward its end (×3 by the last stretch).
// The stream stops before the guardian/boss zone so those fights stay focused.
const streamRate = (c, D) => 1 + 1.5 * D + .04 * Math.min(c - 1, 25); // spawns per second at stage start
function spawnStream(dt) {
  if (g.bossMode) return;
  const top = g.dist + SQY + 40, w = g.waves.find(w => top >= w.from && top < w.to);
  if (!w) return;
  const p = (top - w.from) / (w.to - w.from), lv = tierOf(g.c, w.s);
  g.spawnT -= dt * streamRate(g.c, Dr(lv)) * (1 + 2 * p);
  while (g.spawnT <= 0) {
    g.spawnT += 1;
    const hp = 3.5 * Hm(lv, w.s), x = rnd(RL + 15, RR - 15), n = R() < .25 ? 3 : 1; // a runner, or a small clump
    for (let i = 0; i < n; i++) g.objs.push({ k: 'en', stream: true, d: top + rnd(0, 30) + i * 14, x: clamp(x + rnd(-18, 18), RL + 15, RR - 15), hp, max: hp, r: 10, ph: rnd(0, 6) });
  }
}

// ---------- weapons ----------
function updateWeapons(dt, r) {
  const T = power(), mir = skl('mirror');
  const tick = (id, cd) => { g.wt[id] = (g.wt[id] ?? .5) - dt; if (g.wt[id] > 0) return false; g.wt[id] = cd; return true; };
  let targets = null;
  const tg = () => targets || (targets = g.objs.filter(hittable));

  if (g.evo.kunai) {
    // Dragon Fang: one huge blade per lane-sweep that pierces everything
    if (tick('kunai', .9)) {
      const n = 1 + mir;
      for (let i = 0; i < n; i++) {
        const f = n > 1 ? i / (n - 1) - .5 : 0;
        g.proj.push({ k: 'fang', x: clamp(g.sx + f * 70, RL + 14, RR - 14), y: SQY - r * .6, vx: 0, vy: -640, dmg: T * 2.4, pierce: Infinity, hit: new Set(), life: 2, w: 16 });
      }
      SFX.arrow(); SFX.zap();
    }
  } else if (skl('kunai')) {
    const s = KUNAI(skl('kunai'));
    if (tick('kunai', s.cd)) {
      const n = s.n + mir;
      for (let i = 0; i < n; i++) {
        const f = n > 1 ? i / (n - 1) - .5 : 0;
        g.proj.push({ k: 'kunai', x: clamp(g.sx + f * (r * 1.3 + 20), RL + 6, RR - 6), y: SQY - r * .6, vx: 0, vy: -760, dmg: T * s.dmg, pierce: s.pierce, hit: new Set(), life: 2 });
      }
      SFX.arrow();
    }
  }
  if (skl('talisman')) {
    const s = TALIS(skl('talisman'));
    if (tick('talisman', s.cd) && tg().some(o => o.k !== 'crate')) {
      const n = s.n + mir + (g.evo.talisman ? 1 : 0);
      const ph = g.evo.talisman ? [1.5, 2] : [1, 1]; // Phoenix Seal: harder hits, hotter burn
      for (let i = 0; i < n; i++) g.proj.push({ k: 'tal', x: g.sx, y: SQY - r * .6, vx: (i - (n - 1) / 2) * 140, vy: -260, dmg: T * s.dmg * ph[0], burn: T * s.burn * ph[1], life: 3.5, a: 0 });
      SFX.fire();
    }
  }
  // lightning: strikes the toughest enemy on screen, then chains to its neighbours
  const lightning = (foes, dmg, jumps, fall, gold) => {
    let cur = foes.reduce((a, b) => b.hp > a.hp ? b : a);
    const hit = new Set(), pts = [[cur.x, -10]];
    for (let j = 0; j < jumps && cur; j++) {
      hit.add(cur); const cy = sy(cur); pts.push([cur.x, cy]);
      damage(cur, dmg, cur.x, cy); dmg *= fall;
      cur = nearest(cur.x, cy, foes, hit, 150);
    }
    g.bolts.push({ pts, t: .25, gold }); SFX.zap();
  };
  if (skl('seal')) {
    const s = SEAL(skl('seal')), evo = g.evo.seal; // Raijin's Drum: ~3× as often, 2.5× as hard, +3 jumps, no falloff
    const foes = tg().filter(o => o.k !== 'crate');
    if (foes.length && tick('seal', s.cd * (evo ? .35 : 1))) lightning(foes, T * s.dmg * (evo ? 2.5 : 1), s.jumps + mir + (evo ? 3 : 0), evo ? 1 : .8, evo);
  }
  if (g.sets.Storm) { // Storm set: a free strike every few seconds
    const foes = tg().filter(o => o.k !== 'crate');
    if (foes.length && tick('storm', g.sets.Storm > 1 ? 1 : 2)) lightning(foes, T * 1.2, 3, .8, false);
  }
  if (skl('clones') && g.count > 0) {
    // Smoke Clones: shadow ninjas around the squad, each throwing a star at the enemy nearest to it
    const s = CLONES(skl('clones')), evo = g.evo.clones, k = Math.min(g.clones, CLONE_DRAW);
    g.clA += dt * .8;
    const foes = tg().filter(o => o.k !== 'crate');
    if (foes.length && tick('clones', s.cd)) {
      const dmg = T * s.dmg * (g.clones / k);
      for (let i = 0; i < k; i++) {
        const [x, y] = clonePos(i, k, r), t = nearest(x, y, foes);
        if (!t) break;
        const dx = t.x - x, dy = sy(t) - y, L = Math.hypot(dx, dy) || 1;
        g.proj.push({ k: 'sstar', x, y, vx: dx / L * 620, vy: dy / L * 620, dmg, pierce: 1, hit: new Set(), life: 1.4, a: 0 });
      }
    }
  }
  if (skl('chain')) {
    const evo = g.evo.chain; // Iron Cyclone: 7 bigger blades on a wider orbit that also smash projectiles
    const s = CHAIN(skl('chain')), n = evo ? 7 : s.n, rad = r + (evo ? 46 : 26), dmg = T * s.dmg * (evo ? 1.35 : 1);
    g.chainA += dt * 3.4;
    for (let i = 0; i < n; i++) {
      const a = g.chainA + i / n * 6.283, bx = g.sx + Math.cos(a) * rad, by = SQY + Math.sin(a) * rad * .6;
      for (const o of tg()) {
        if (o.dead || o.chT > 0) continue;
        const rr = (o.k === 'crate' ? 20 : o.r) + (evo ? 14 : 10);
        if (Math.abs(bx - o.x) < rr && Math.abs(by - sy(o)) < rr) { o.chT = .35; damage(o, dmg, bx, by); }
      }
      if (evo) for (const e of g.ebullets) if (!e.dead && Math.abs(e.x - bx) < 18 && Math.abs(e.y - by) < 18) { e.dead = true; spark(e.x, e.y, '#c9ced6', 6); }
    }
    // Iron Cyclone also hurls a spinning blade at the toughest enemy, so it matters in guardian and boss fights too
    const foes = evo && tg().filter(o => o.k !== 'crate');
    if (evo && foes.length && tick('cyclone', 1)) {
      const t = foes.reduce((a, b) => b.hp > a.hp ? b : a), dx = t.x - g.sx, dy = sy(t) - SQY, L = Math.hypot(dx, dy) || 1;
      g.proj.push({ k: 'blade', x: g.sx, y: SQY - r * .6, vx: dx / L * 700, vy: dy / L * 700, dmg: T * 1.3, pierce: 3, hit: new Set(), life: 1.6, w: 10, a: 0 });
    }
  }
}

// where clone i of k stands: a slow ring around the squad
function clonePos(i, k, r) {
  const a = g.clA + i / k * 6.283, rad = r + 22 + (i % 2) * 10;
  return [clamp(g.sx + Math.cos(a) * rad, RL + 8, RR - 8), SQY + Math.sin(a) * rad * .45];
}
function updateProjectiles(dt) {
  if (!g.proj.length) return;
  const targets = g.objs.filter(hittable);
  for (const p of g.proj) {
    p.life -= dt;
    if (p.k === 'tal') {
      if (!p.tgt || p.tgt.dead) p.tgt = nearest(p.x, p.y, targets);
      if (p.tgt) {
        const dx = p.tgt.x - p.x, dy = sy(p.tgt) - p.y, L = Math.hypot(dx, dy) || 1, k = Math.min(1, dt * 5);
        p.vx += (dx / L * 440 - p.vx) * k; p.vy += (dy / L * 440 - p.vy) * k;
      }
      p.a += dt * 6;
    }
    if (p.k === 'sstar' || p.k === 'blade') p.a += dt * 20;
    p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.life <= 0 || p.y < -30 || p.y > H + 30 || p.x < RL - 20 || p.x > RR + 20) { p.dead = true; continue; }
    for (const o of targets) {
      if (o.dead || (p.hit && p.hit.has(o))) continue;
      const rr = (o.k === 'crate' ? 20 : o.r) + (p.w || 4);
      if (Math.abs(p.x - o.x) < rr && Math.abs(p.y - sy(o)) < rr + 4) {
        damage(o, p.dmg, p.x, p.y);
        if (p.k === 'tal') { if (!o.dead) o.burn = { t: 3, dps: p.burn }; spark(p.x, p.y, '#ff8a3d', 8, 120); p.dead = true; break; }
        p.hit.add(o); if (--p.pierce <= 0) { p.dead = true; break; }
      }
    }
  }
  g.proj = g.proj.filter(p => !p.dead);
}

// ---------- draw ----------
function rrect(x, y, w, h, r) { cx.beginPath(); if (cx.roundRect) cx.roundRect(x, y, w, h, r); else cx.rect(x, y, w, h); }

function drawScene(dist) {
  // moss garden
  cx.fillStyle = '#2f4a2a'; cx.fillRect(-10, -10, W + 20, H + 20);
  cx.fillStyle = 'rgba(255,255,255,.035)';
  for (let y = -80 + dist % 80; y < H; y += 80) { cx.fillRect(0, y, RL, 40); cx.fillRect(RR, y, W - RR, 40); }
  // stone path
  cx.fillStyle = '#8c8272'; cx.fillRect(RL, -10, RR - RL, H + 20);
  cx.strokeStyle = 'rgba(60,50,40,.35)'; cx.lineWidth = 2;
  const off = dist % 40;
  for (let y = -40 + off, row = Math.floor(dist / 40); y < H + 40; y += 40, row--) {
    cx.beginPath(); cx.moveTo(RL, y); cx.lineTo(RR, y); cx.stroke();
    const shift = (row & 1) ? 0 : 26;
    for (let x = RL + shift; x < RR; x += 52) { cx.beginPath(); cx.moveTo(x, y); cx.lineTo(x, y + 40); cx.stroke(); }
  }
  cx.fillStyle = '#5a3b22'; cx.fillRect(RL - 7, -10, 7, H + 20); cx.fillRect(RR, -10, 7, H + 20);
  cx.fillStyle = '#7a5232'; cx.fillRect(RL - 7, -10, 2, H + 20); cx.fillRect(RR + 5, -10, 2, H + 20);
  // scenery: cherry blossoms, bamboo, stone lanterns
  for (const o of decor) {
    const rel = ((o.d - dist) % TILE + TILE) % TILE - 250, y = SQY - rel;
    if (y < -50 || y > H + 50) continue;
    const s = o.s;
    if (o.t === 0 && o.d % 3 < 1.6) {
      cx.fillStyle = 'rgba(0,0,0,.25)'; cx.beginPath(); cx.ellipse(o.x + 3, y + 9, 14 * s, 6 * s, 0, 0, 7); cx.fill();
      cx.fillStyle = '#d97a9a'; cx.beginPath(); cx.arc(o.x, y, 14 * s, 0, 7); cx.fill();
      cx.fillStyle = '#f5b5c8'; cx.beginPath(); cx.arc(o.x - 4, y - 4, 9 * s, 0, 7); cx.arc(o.x + 6, y + 2, 6 * s, 0, 7); cx.fill();
    } else if (o.t === 0) {
      for (let i = -1; i <= 1; i++) {
        const bx = o.x + i * 5 * s;
        cx.fillStyle = '#5f8f3a'; cx.fillRect(bx - 2, y - 22 * s, 4, 30 * s);
        cx.fillStyle = '#3f6626'; cx.fillRect(bx - 2, y - 10 * s, 4, 2); cx.fillRect(bx - 2, y + 2 * s, 4, 2);
      }
      cx.fillStyle = '#7fb04a'; cx.beginPath(); cx.ellipse(o.x, y - 22 * s, 9 * s, 4 * s, .4, 0, 7); cx.fill();
    } else {
      cx.fillStyle = '#6e6a62'; cx.fillRect(o.x - 3, y - 4, 6, 12);
      cx.fillStyle = '#8f8a80'; cx.fillRect(o.x - 7, y - 12, 14, 9);
      cx.fillStyle = '#ffcf6b'; cx.fillRect(o.x - 3, y - 10, 6, 5);
      cx.fillStyle = '#5b5750'; cx.beginPath(); cx.moveTo(o.x - 10, y - 12); cx.lineTo(o.x, y - 19); cx.lineTo(o.x + 10, y - 12); cx.fill();
    }
  }
}

function draw() {
  cx.save();
  if (g && g.shake > 0 && running) cx.translate(frnd(-4, 4), frnd(-4, 4));
  drawScene(g ? g.dist : idleDist);
  if (!g) { cx.restore(); return; }
  cx.fillStyle = 'rgba(255,255,255,.12)';
  for (let i = 1; i < g.lanes; i++) { const lx = RL + i * (RR - RL) / g.lanes; for (let y = -60 + g.dist % 60; y < H; y += 60) cx.fillRect(lx - 1.5, y, 3, 28); }

  // boss charge warning: a pulsing red strip down the locked lane
  const bossObj = g.bossMode && g.objs.find(o => o.k === 'boss' && o.state === 'tele');
  if (bossObj) {
    const by = sy(bossObj), w = bossObj.r * 2 + 12, x0 = bossObj.lane - w / 2, p = .25 + .2 * Math.sin(performance.now() / 70);
    cx.fillStyle = `rgba(255,40,40,${p})`; cx.fillRect(x0, by, w, H - by);
    cx.fillStyle = 'rgba(255,90,90,.85)'; cx.fillRect(x0, by, 3, H - by); cx.fillRect(x0 + w - 3, by, 3, H - by);
    cx.font = '900 20px system-ui,sans-serif'; cx.textAlign = 'center'; cx.fillStyle = 'rgba(255,220,220,.9)';
    for (let yy = by + 70 + (performance.now() / 6) % 60; yy < H; yy += 60) cx.fillText('▼', bossObj.lane, yy);
  }

  const sorted = g.objs.slice().sort((a, b) => sy(a) - sy(b));
  for (const o of sorted) {
    const y = sy(o);
    if (y < -90 || y > H + 90) continue;
    if (o.k === 'gate') drawGate(o, y);
    else if (o.k === 'spike') drawSpike(o, y);
    else if (o.k === 'en') drawEnemy(o, y);
    else if (o.k === 'crate') drawCrate(o, y);
    else if (o.k === 'boss') drawBoss(o, y);
    else if (o.k === 'mini') drawMini(o, y);
    else if (o.k === 'stage' && o.s > 1) drawStageLine(o, y);
    else if (o.k === 'torii') drawTorii(o, y);
    if (o.burn) { const br = o.r || 20; cx.fillStyle = Math.random() < .5 ? '#ff8a3d' : '#ffd84d'; cx.beginPath(); cx.arc(o.x + frnd(-br * .5, br * .5), y - br * .6 + frnd(-3, 3), 3.5, 0, 7); cx.fill(); }
  }

  const spin = performance.now() / 40;
  for (const b of g.bullets) {
    if (b.fire) { cx.fillStyle = 'rgba(255,120,40,.45)'; cx.beginPath(); cx.arc(b.x, b.y + 6, 6, 0, 7); cx.fill(); }
    drawStar(b.x, b.y, 6, b.a + spin, b.fire, b.gold);
  }
  drawWeapons();
  for (const e of g.ebullets) drawEnemyShot(e);

  drawClones();
  drawSquad();
  if (g.invuln > 0) {
    // revive shield: pulsing gold ring while nothing can hurt the squad
    const rr = squadR() + 18, a = .35 + .25 * Math.sin(performance.now() / 60);
    cx.strokeStyle = `rgba(255,236,150,${a})`; cx.lineWidth = 4;
    cx.beginPath(); cx.ellipse(g.sx, SQY, rr, rr * .65, 0, 0, 7); cx.stroke();
  }
  if (g.smoke > 0) {
    const r = squadR() + 14, t = performance.now() / 300;
    cx.globalAlpha = Math.min(.55, g.smoke * .4);
    for (let i = 0; i < 9; i++) {
      const a = i / 9 * 6.283 + t;
      cx.fillStyle = i % 2 ? '#cfd6e0' : '#aab3bf';
      cx.beginPath(); cx.arc(g.sx + Math.cos(a) * r * .8, SQY + Math.sin(a) * r * .45, 16, 0, 7); cx.fill();
    }
    cx.globalAlpha = 1;
  }

  for (const p of g.parts) { cx.globalAlpha = Math.min(1, p.t * 3); cx.fillStyle = p.col; cx.fillRect(p.x - p.s / 2, p.y - p.s / 2, p.s, p.s); }
  cx.globalAlpha = 1;
  cx.textAlign = 'center';
  for (const p of g.pops) {
    cx.font = '900 ' + (p.big ? 28 : 20) + 'px system-ui,sans-serif';
    cx.globalAlpha = Math.min(1, p.t * 2);
    cx.lineWidth = 5; cx.strokeStyle = '#000'; cx.strokeText(p.txt, p.x, p.y);
    cx.fillStyle = p.col; cx.fillText(p.txt, p.x, p.y);
  }
  cx.globalAlpha = 1;
  cx.restore();

  if (g.evoFlash > 0) {
    // evolution: gold burst from the squad that fades out
    const v = cx.createRadialGradient(g.sx, SQY, 20, g.sx, SQY, H);
    v.addColorStop(0, `rgba(255,246,200,${Math.min(.85, g.evoFlash)})`); v.addColorStop(1, `rgba(255,190,40,${g.evoFlash * .35})`);
    cx.fillStyle = v; cx.fillRect(0, 0, W, H);
  }
  if (g.hurt > 0) {
    const v = cx.createRadialGradient(W / 2, H / 2, H * .3, W / 2, H / 2, H * .75);
    v.addColorStop(0, 'rgba(255,0,0,0)'); v.addColorStop(1, 'rgba(255,0,0,' + (g.hurt * 1.4) + ')');
    cx.fillStyle = v; cx.fillRect(0, 0, W, H);
  }
  if (g.banner) {
    const a = Math.min(1, g.banner.t * 2);
    const sub = g.banner.sub, ty = H * .36 + (sub ? 38 : 45);
    cx.globalAlpha = a; cx.fillStyle = 'rgba(0,0,0,.5)'; cx.fillRect(0, H * .36, W, sub ? 74 : 64);
    cx.font = '900 ' + (g.banner.small ? 24 : 36) + 'px system-ui,sans-serif'; cx.textAlign = 'center';
    if (g.banner.gold) { cx.lineWidth = 6; cx.strokeStyle = 'rgba(120,70,0,.9)'; cx.strokeText(g.banner.txt, W / 2, ty); }
    cx.fillStyle = g.banner.red ? '#ff4d4d' : g.banner.gold ? '#ffe680' : '#ffb020'; cx.fillText(g.banner.txt, W / 2, ty);
    if (sub) { cx.font = '800 14px system-ui,sans-serif'; cx.fillStyle = '#fff'; cx.fillText(sub, W / 2, H * .36 + 62); }
    cx.globalAlpha = 1;
  }
  drawHUD();
}

function drawStageLine(o, y) {

  cx.font = '900 13px system-ui,sans-serif'; cx.textAlign = 'center';

function drawWeapons() {
  for (const p of g.proj) {
    cx.save(); cx.translate(p.x, p.y);
    if (p.k === 'fang') {
      // Dragon Fang: a long glowing blade with a jade trail

      cx.fillStyle = '#2fbf71'; cx.beginPath(); cx.moveTo(0, -20); cx.lineTo(5, 0); cx.lineTo(0, 8); cx.lineTo(-5, 0); cx.fill();

      for (let j = 0; j < 3; j++) { cx.rotate(2.094); cx.fillStyle = '#dbeeff'; cx.beginPath(); cx.moveTo(0, -10); cx.quadraticCurveTo(9, -4, 3, 6); cx.lineTo(0, 0); cx.fill(); }

      cx.fillStyle = '#3a2a1e'; cx.fillRect(-1.5, 4, 3, 8);

    x.moveTo(cx0 + R * .7, cy - R * .45); x.quadraticCurveTo(cx0 + R + 4, cy + 4, cx0 + R + 4, cy + 26); x.stroke();
    x.fillStyle = h.col; x.beginPath(); x.arc(cx0, cy, R + 4, 0, 7); x.fill();
    x.fillStyle = h.body; x.beginPath(); x.arc(cx0, cy, R, 0, 7); x.fill();
    x.fillStyle = 'rgba(255,255,255,.09)'; x.beginPath(); x.arc(cx0 - 6, cy - 8, R * .72, 0, 7); x.fill();
    // headband with its knot, in the squad skin colour

    x.beginPath(); x.arc(cx0 + R * .72, cy - R * .62 + 4.5, 6, 0, 7); x.fill();

    for (const s of [-1, 1]) {
      const ex = cx0 + s * R * .3;

// ---------- save backup / restore codes ----------
// Testers lose progress when they switch device or browser, or clear site data. A save code carries the whole
// save: SS1.<base64url of the UTF-8 JSON>.<checksum>. The checksum (FNV-1a, base36) rejects truncated or
// mistyped codes, the JSON is then sanity-checked, and a restored save goes through migrateSave() exactly
// like one loaded from localStorage. (It stops accidents, not cheaters: the save is client-side anyway.)
const CODE_VER = 'SS1';

  if ('up' in s && (!isObj(s.up) || Object.keys(s.up).some(k => !Number.isInteger(s.up[k]) || !isNum(s.up[k], 0, MAXUP)))) return false;
  if ('stats' in s && (!isObj(s.stats) || Object.keys(s.stats).some(k => !isNum(s.stats[k], 0, 1e15)))) return false;
  for (const k of ['skins', 'unlocked', 'evoSeen']) if (k in s && (!Array.isArray(s[k]) || s[k].some(v => typeof v !== 'string'))) return false;
  if ('daily' in s && !isObj(s.daily)) return false;
  if ('heroes' in s && (!isObj(s.heroes) || Object.values(s.heroes).some(m => !Number.isInteger(m) || !isNum(m, 1, MASTERY_MAX)))) return false;
  if ('hero' in s && typeof s.hero !== 'string') return false;

  const m = /^SS(\d+)\.([A-Za-z0-9_-]+)\.([0-9a-z]{1,7})$/.exec(txt);
  if (!m) return { error: "That isn't a Shuriken Squad save code. Codes start with SS1." };
  if ('SS' + m[1] !== CODE_VER) return { error: 'This code comes from a newer version of the game. Reload the page to update, then try again.' };
  if (codeSum(m[2]) !== m[3]) return { error: "This code is incomplete or has a typo. Copy the whole code again and paste it here." };
  let s = null;
  try { s = JSON.parse(new TextDecoder('utf-8', { fatal: true }).decode(unb64url(m[2]))); } catch (e) {}
  if (!validSave(s)) return { error: "This code is damaged and can't be loaded." };

}
const escHtml = s => String(s).replace(/[&<>"']/g, ch => '&#' + ch.charCodeAt(0) + ';');
function backup(err = '', pasted = '') {
  const code = saveCode();
  panel(`<h2>💾 Save Backup</h2><div class="bk">
    <div class="sect">Back up</div>
    <div class="help">Keep this code somewhere safe (notes, email, a message to yourself). It holds all your progress.</div>
    <textarea id="bkcode" class="code" rows="3" readonly spellcheck="false">${code}</textarea>
    <button id="bkcopy">📋 Copy code</button><div id="bkmsg" class="bkmsg"></div>
    <div class="sect">Restore</div>
    <div class="help">New phone or browser? Paste your code here to load that progress.</div>
    <textarea id="rscode" class="code" rows="3" placeholder="SS1.…" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">${escHtml(pasted)}</textarea>
    ${err ? `<div class="bkmsg bad">${err}</div>` : ''}<button id="rsgo" class="sec">Restore</button></div>`,
    [['Back', home, 'sec']]);
  document.getElementById('bkcopy').onclick = () => {
    initAudio(); SFX.click();
    const ta = document.getElementById('bkcode'), msg = document.getElementById('bkmsg');
    const done = () => { msg.textContent = '✓ Copied! Paste it somewhere safe.'; SFX.good(); };
    const manual = () => { // no clipboard access: select it so the player can copy it themselves
      let ok = false;
      try { ta.focus(); ta.select(); ta.setSelectionRange(0, code.length); ok = document.execCommand('copy'); } catch (e) {}
      if (ok) done(); else msg.textContent = "Couldn't copy automatically. The code is selected: copy it with your device's Copy option.";

// ---------- daily missions ----------
// Three a day (easy / medium / hard), the same all day and seeded by the date. Progress comes from finished runs.
// Rewards scale with the player's chapter; claiming all three opens the Daily Chest.
const MISSIONS = [
  { stat: 'kills',     goals: [600, 1200, 2000], txt: n => `Defeat ${fmtN(n)} enemies` },
  { stat: 'stages',    goals: [4, 8, 12],        txt: n => `Clear ${n} stages` },
  { stat: 'dodges',    goals: [2, 4, 6],         txt: n => `Dodge ${n} guardian or boss charges` },
  { stat: 'choices',   goals: [3, 5, 8],         txt: n => `Take ${n} Choice Gate lanes` },
  { stat: 'gateBumps', goals: [8, 15, 25],       txt: n => `Raise gates ${n} times by shooting them` },
  { stat: 'guardians', goals: [3, 6, 10],        txt: n => `Defeat ${n} guardians` },
  { stat: 'levelups',  goals: [10, 20, 30],      txt: n => `Level up ${n} times` },
  { stat: 'evolves',   goals: [1, 2, 3],         txt: n => `Evolve ${n} weapon${n > 1 ? 's' : ''}` },

const MISSION_PAY = [100, 150, 220], CHEST_PAY = 300;
const missionG = () => Gs(tierOf(save.chapter, 3)); // rewards grow with the chapter like everything else
const missionReward = m => Math.round(MISSION_PAY[m.tier] * missionG());

function hashStr(s) { let h = 2166136261; for (const ch of s) h = Math.imul(h ^ ch.charCodeAt(0), 16777619); return h >>> 0; }

  const day = dayKey(Date.now());

  // evolving needs a complete pair unlocked; don't hand brand-new players an impossible mission
  const canEvolve = Object.keys(EVOS).some(a => isUnlocked(a) && isUnlocked(EVOS[a].with));
  const pool = MISSIONS.filter(m => m.stat !== 'evolves' || canEvolve), rng = makeRng(hashStr(day)), picks = [];
  while (picks.length < 3) picks.push(pool.splice(Math.floor(rng() * pool.length), 1)[0]);
  save.missions = { day, list: picks.map((m, i) => ({ stat: m.stat, goal: m.goals[i], prog: 0, claimed: false, tier: i })), chest: false };
  persist();
  return save.missions;
}
function missionsClaimable() {
  const ms = ensureMissions();
  return ms.list.filter(m => m.prog >= m.goal && !m.claimed).length + (ms.list.every(m => m.claimed) && !ms.chest ? 1 : 0);
}
function missions() {
  const ms = ensureMissions();
  const rows = ms.list.map((m, i) => {
    const def = MISSIONS.find(d => d.stat === m.stat), done = m.prog >= m.goal, rw = fmtN(missionReward(m));
    const btn = m.claimed ? '<button disabled>✓</button>' : done ? `<button data-m="${i}">🪙${rw}</button>` : `<button class="sec" disabled>🪙${rw}</button>`;
    return `<div class="up"><span class="ai">${['🟢', '🟡', '🔴'][m.tier]}</span><div class="info"><div class="n">${def.txt(m.goal)}</div>
      <div class="pbar"><i style="width:${m.prog / m.goal * 100}%"></i></div><div class="d">${fmtN(m.prog)} / ${fmtN(m.goal)}</div></div>${btn}</div>`;
  }).join('');
  const allClaimed = ms.list.every(m => m.claimed);
  const chest = `<div class="up"><span class="ai">🎁</span><div class="info"><div class="n">Daily Chest</div><div class="d">Claim all 3 missions to open it</div></div>
    ${ms.chest ? '<button disabled>✓</button>' : `<button id="chestb" ${allClaimed ? '' : 'disabled class="sec"'}>🪙${fmtN(chestReward())}</button>`}</div>`;
  const mid = new Date(); mid.setHours(24, 0, 0, 0);
  const mins = Math.max(1, Math.round((mid - Date.now()) / 60000));
  panel(`<h2>📋 Daily Missions</h2>${coinTag()}${rows}${chest}<div class="help">New missions in ${Math.floor(mins / 60)}h ${mins % 60}m. Unclaimed rewards expire at midnight.</div>`,
    [['Back', home, 'sec']]);
  ui.querySelectorAll('button[data-m]').forEach(b => b.onclick = () => {
    const m = ms.list[+b.dataset.m];
    if (m.claimed || m.prog < m.goal) return;
    m.claimed = true; save.coins += missionReward(m); persist(); initAudio(); SFX.daily(); missions();
  });
  const cb = document.getElementById('chestb');
  if (cb) cb.onclick = () => {
    if (ms.chest || !ms.list.every(m => m.claimed)) return;
    ms.chest = true; save.coins += chestReward(); persist(); initAudio(); SFX.win(); missions();
  };
}

// Fold a finished run into lifetime stats and today's missions; return new unlocks and missions just completed.
function commitRun(won) {
  const st = save.stats, before = new Set(save.unlocked);
  st.kills += g.kills;
  for (const k of ['dodges', 'gateBumps', 'rallies', 'evolves', 'fullBoss', 'muls']) st[k] += g.st[k] || 0;
  if (won) { st.chapters++; if (g.st.sac) st.sacClears++; }
  for (const id in g.evo) if (!save.evoSeen.includes(id)) save.evoSeen.push(id);
  for (const id in UNLOCKS) if (!isUnlocked(id) && st[UNLOCKS[id].stat] >= UNLOCKS[id].goal) save.unlocked.push(id);
  const fresh = save.unlocked.filter(id => !before.has(id));
  if (fresh.length) save.armoryNew = true;
  // today's missions
  const ms = ensureMissions(), done = [];
  const runSt = { kills: g.kills, stages: g.st.stages + (won ? 1 : 0), dodges: g.st.dodges, choices: g.st.choices,
                  gateBumps: g.st.gateBumps, guardians: g.st.guardians, levelups: g.xpLv - 1, evolves: g.st.evolves };
  for (const m of ms.list) {
    const was = m.prog >= m.goal;
    m.prog = Math.min(m.goal, m.prog + (runSt[m.stat] || 0));
    if (!was && m.prog >= m.goal) done.push(m);
  }
  return { fresh, done };
}
// results-screen block: missions just completed, what just unlocked, and the closest next unlock to chase
function resultsExtras({ fresh, done, heroes = [] }) {
  let h = heroes.map(id => `<div class="unl">🎉 NEW HERO UNLOCKED<b>${HEROES[id].icon} ${HEROES[id].name}</b><span>${HEROES[id].role} · starts with ${SK[HEROES[id].weapon].icon} ${SK[HEROES[id].weapon].name}. Pick them in 🥷 Heroes on the home screen.</span></div>`).join('');
  h += done.map(m => `<div class="nextu" style="color:#7dffa0">📋 Mission complete: <b>${MISSIONS.find(d => d.stat === m.stat).txt(m.goal)}</b>. Claim it in Daily Missions!</div>`).join('');
  h += fresh.map(id => `<div class="unl">🔓 NEW ${SK[id].a ? 'WEAPON' : 'SKILL'} UNLOCKED<b>${SK[id].icon} ${SK[id].name}</b></div>`).join('');
  const next = Object.keys(UNLOCKS).filter(id => !isUnlocked(id)).map(id => ({ id, ...unlockProgress(id) })).sort((a, b) => b.p - a.p)[0];
  if (next) h += `<div class="nextu">Next unlock: <b>${SK[next.id].icon} ${SK[next.id].name}</b><br>${UNLOCKS[next.id].cond}${next.goal > 1 ? ` (${fmtN(next.cur)} / ${fmtN(next.goal)})` : ''}</div>`;
  return h;
}

// ---------- revive (once per run) ----------
// Placeholder for a rewarded-ad SDK. When the game ships as an app, show the ad here and call
// done(true) only if it was watched to the end. In the browser build the revive is free.
function showRewardedAd(placement, done) { done(true); }
const REVIVE_SECS = 7, REVIVE_SQUAD = .6, REVIVE_INVULN = 2.5;
function offerRevive() {
  running = false; dragX = null; g.reviveOpen = true; SFX.hurt();
  let left = REVIVE_SECS;
  panel(`<h2>💀 So close!</h2><p><b style="color:#ff6b6b">${g.lossCause || 'Your squad was wiped out'}.</b><br>
    Get back up with <b>${Math.round(g.cap * REVIVE_SQUAD)}</b> ninjas? (once per run)</p><div class="revt" id="revt">${left}</div>`,
    [['❤️ Revive', () => showRewardedAd('revive', ok => ok ? revive() : declineRevive())], ['Give up', declineRevive, 'sec']]);
  g.reviveTimer = setInterval(() => {
    const el = document.getElementById('revt'); if (el) el.textContent = --left;
    if (left <= 0) declineRevive();
  }, 1000);
}
function declineRevive() {
  if (!g || !g.reviveOpen) return;
  clearInterval(g.reviveTimer); g.reviveOpen = false; lose();
}
function revive() {
  if (!g || !g.reviveOpen) return;
  clearInterval(g.reviveTimer); g.reviveOpen = false; g.revived = true;
  g.count = Math.max(1, Math.round(g.cap * REVIVE_SQUAD)); g.lossCause = null; g.invuln = REVIVE_INVULN;
  // shockwave: wipe nearby enemies (no rewards) and every enemy shot; knock guardians and the boss back
  for (const o of g.objs) {
    if (o.dead) continue;
    const y = sy(o);
    if (o.k === 'en' && Math.abs(y - SQY) < 260) { o.dead = true; spark(o.x, y, '#ffffff', 6, 140); }
    else if (o.k === 'mini' && y > SQY - GUARD_Y_OFF - 60) {
      o.d = g.dist + GUARD_Y_OFF + 140; // back above the standoff line; it has to approach and hold again
      o.charging = false; o.warned = false; o.hold = undefined;
    } else if (o.k === 'boss' && g.bossMode && o.homeY !== undefined) { // only once the fight has started
      if (o.berserk) o.homeY = Math.min(o.homeY, 170); // undo the berserk advance
      o.state = 'idle'; o.d = g.dist + SQY - o.homeY; o.specT = Math.max(o.specT || 0, 3);
    }
  }
  g.objs = g.objs.filter(o => !o.dead);
  g.ebullets = [];
  g.evoFlash = .7; g.shake = .3; spark(g.sx, SQY, '#ffffff', 50, 260);
  g.banner = { txt: '❤️ REVIVED!', t: 1.4, gold: true };
  SFX.evolve();
  ui.innerHTML = ''; running = true;
}

// pause screen: build, synergy progress (active sets spelled out) and boons
function runInfoHtml() {
  const tags = Object.keys(TAGS).map(t => [t, tagCount(t)]).filter(([, n]) => n > 0).sort((a, b) => b[1] - a[1]);
  const chips = tags.map(([t, n]) => { const tier = setTier(n);
    return `<span class="${tier ? 'on' : ''}">${TAGS[t].icon} ${t} ${tier > 1 ? SET_AT[1] + '/' + SET_AT[1] + ' ★' : tier ? SET_AT[0] + '/' + SET_AT[0] + ' ✓' : n + '/' + SET_AT[0]}</span>`; }).join('');
  const sets = Object.keys(g.sets).map(t => `<div class="setl">${TAGS[t].icon} ${t} set${g.sets[t] > 1 ? ' ★' : ''}: ${TAGS[t].d[g.sets[t] - 1]}</div>`).join('');
  const boons = Object.keys(g.boons).map(b => `<div class="bnr"><span style="font-size:20px">${BOONS[b].icon}</span><span><b>${BOONS[b].name}</b><br>${BOONS[b].d}</span></div>`).join('');
  const h = HEROES[g.hero], hero = `<div class="bnr" style="background:#1a2230;border-color:${h.col}"><span style="font-size:20px">${h.icon}</span><span><b>${h.name}</b> · Mastery ${g.mastery}<br>${h.sig}: ${h.sd(g.mastery)}</span></div>`;
  return `<div class="notes" style="max-height:min(360px,50vh)">${hero}${buildHtml(g.sk, g.evo, null)}<div class="tags" style="justify-content:center;margin:0 0 6px">${chips}</div>${sets}${boons ? '<div class="sect" style="margin-top:10px">Boons</div>' + boons : ''}</div>`;
}
function pauseGame() {
  if (!running) return;
  running = false; dragX = null;
  panel('<h2>Paused</h2>' + runInfoHtml(), [['Resume', () => { ui.innerHTML = ''; running = true; }], ['Quit to menu', home, 'sec']]);
}

function bank(extra) {
  const mult = 1 + ECON.coinUp * save.up.coin, earned = Math.round((g.coins * g.G + extra) * mult);
  save.coins += earned; g.banked = true; persist(); return earned; // banked: the HUD stops adding run coins on top
}

// ---------- ×2 coins (rewarded ad on the results screens) ----------
// Run coins are only credited at the end of a run (bank), so doubling banks exactly that amount once more,
// never daily reward, mission or chest coins. Every results screen gets its own reward object whose state
// (open → pending while the ad plays → done) makes a second claim impossible: double taps, a screen re-opened
// from Upgrades, or a late ad callback all hit the state check.
let rewardSeq = 0;
const newReward = earned => ({ id: ++rewardSeq, earned, state: 'open' });
const rewardShown = r => ui.innerHTML.includes(`data-x2="${r.id}"`);
function claimDouble(r, rerender) {
  if (!r || r.state !== 'open' || !(r.earned > 0)) return false;
  r.state = 'pending';
  showRewardedAd('double', ok => {
    if (r.state !== 'pending') return;
    r.state = ok ? 'done' : 'open';
    if (ok) { save.coins += r.earned; persist(); initAudio(); SFX.daily(); }
    if (rerender && rewardShown(r)) rerender(); // only redraw if that results screen is still up
  });
  if (r.state === 'pending' && rerender && rewardShown(r)) rerender(); // the ad is still playing
  return true;
}
const earnedHtml = (r, txt) => r.state === 'done'
  ? `${txt} <b data-x2="${r.id}" class="x2done">🪙 ${fmtN(r.earned * 2)} <span>×2</span></b>`
  : `${txt} <b data-x2="${r.id}" style="color:#ffd84d">🪙 ${fmtN(r.earned)}</b>`;
const x2Btn = (r, rerender) => r.earned > 0 && r.state !== 'done'
  ? [[r.state === 'pending' ? '🎬 Loading…' : `🎬 ×2 Coins <small>(+🪙 ${fmtN(r.earned)})</small>`, () => claimDouble(r, rerender), 'ad']] : [];

function win() {
  running = false; SFX.win();
  const c = g.c, left = g.count, kills = g.kills, sk = g.sk, evo = g.evo, run = commitRun(true), earned = bank(ECON.clearPer * g.lv + left), rw = newReward(earned);
  save.chapter = c + 1; save.bestStage = 0; run.heroes = checkHeroUnlocks(); persist();
  if (run.fresh.length || run.done.length || run.heroes.length) setTimeout(() => SFX.daily(), 600);
  const champ = c === MAX_CHAPTER ? `<p style="color:#ffd84d"><b>🏆 You beat all ${MAX_CHAPTER} chapters! You are a true ninja master. Endless mode unlocked.</b></p>` : '';
  const after = () => panel(`<h1>CHAPTER ${c} <span>CLEARED</span></h1>${champ}<p>${bossName((c - 1) % 3)} defeated with <b>${left}</b> ninjas left.<br>⚔ <b>${kills}</b> enemies defeated<br>${earnedHtml(rw, 'You earned')}</p>${buildHtml(sk, evo)}${resultsExtras(run)}${coinTag()}`,
    [...x2Btn(rw, after), ['▶ Next Chapter', () => newGame()], ['Upgrades', () => shop(after), 'sec third'], ['Menu', home, 'sec third']]);
  after();
}

function lose() {
  running = false; SFX.lose();
  const c = g.c, stage = g.stage, kills = g.kills, sk = g.sk, evo = g.evo, cause = g.lossCause || 'Your squad was wiped out', run = commitRun(false), earned = bank(0), rw = newReward(earned);
  save.bestStage = Math.max(save.bestStage, stage); persist();
  if (run.fresh.length || run.done.length) setTimeout(() => SFX.daily(), 900);
  const after = () => panel(`<h1>CLAN <span>DEFEATED</span></h1><p><b style="color:#ff6b6b">${cause}.</b><br>Chapter <b>${c}</b> · reached <b>stage ${stage}/${STAGES}</b> · ⚔ <b>${kills}</b> defeated<br>${earnedHtml(rw, 'You still earned')} — spend it on upgrades.</p>${buildHtml(sk, evo)}${resultsExtras(run)}${coinTag()}`,
    [...x2Btn(rw, after), ['↻ Try Again', () => newGame()], ['Upgrades', () => shop(after), 'sec third'], ['Menu', home, 'sec third']]);
  after();
}

// ---------- loop ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.033, (now - last) / 1000); last = now;
  if (running && g) {
    // evolutions play in slow motion for a moment (real time, not game time)
    if (g.slow > 0) { g.slow -= dt; update(dt * .3); } else update(dt);
  }
  if (!g) idleDist += 60 * dt;
  draw();
  requestAnimationFrame(frame);
}
home();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
